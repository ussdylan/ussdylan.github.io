<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>COMICBOX — Track every issue</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0c'/%3E%3Crect x='5' y='5' width='54' height='54' rx='10' fill='%23e0392c'/%3E%3Ccircle cx='47' cy='16' r='5' fill='%23f2b705'/%3E%3Ctext x='32' y='45' font-family='Arial Black, Arial, sans-serif' font-weight='900' font-size='34' fill='%23f3f1e9' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Permanent+Marker&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c;
  --bg2:#161513;
  --bg3:#211f1c;
  --card:#1b1a17;
  --text:#f3f1e9;
  --dim:#a9a49a;
  --dim2:#716c62;
  --red:#e0392c;
  --yellow:#f2b705;
  --green:#3c9169;
  --cyan:#33a1c9;
  --line:1px solid #34322d;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
.hidden{display:none !important;}
h1,h2,h3,.display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.8px;font-weight:400;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:#3a382f;border-radius:4px;}
button{
  font-family:'Inter',sans-serif;
  font-weight:700;
  cursor:pointer;
  border:none;
  background:#2c2a26;
  color:var(--text);
  padding:10px 18px;
  border-radius:4px;
  font-size:13px;
  transition:background .12s ease, transform .08s ease;
}
button:hover{background:#3a372f;}
button:active{transform:scale(.97);}
button.primary{background:var(--red);color:#fff;}
button.primary:hover{background:#f04a3b;}
button.ghost{background:transparent;border:1.5px solid #4a4740;}
button.ghost:hover{background:#211f1c;}
button.small{padding:6px 12px;font-size:11.5px;}
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:2.5px solid var(--cyan); outline-offset:2px;
}
input,textarea,select{
  font-family:'Inter',sans-serif;
  border:1.5px solid #45423a;
  border-radius:4px;
  padding:9px 11px;
  background:#0f0e0c;
  color:var(--text);
  font-size:14px;
  width:100%;
}
input::placeholder,textarea::placeholder{color:#5f5b52;}
textarea{resize:vertical;min-height:70px;}
label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--dim);display:block;margin-bottom:5px;}
.field{margin-bottom:14px;}

/* ---------- shell ---------- */
#topbar{
  background:linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,0));
  padding:16px 32px 30px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
#topbar.solid{background:var(--bg2);border-bottom:var(--line);padding-bottom:16px;}
#topbar .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--red);letter-spacing:2px;}
#topbar .who{display:flex;align-items:center;gap:12px;}
.avatar{
  width:32px;height:32px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;
}
#tabs{display:flex;gap:22px;padding:0 32px;margin-top:-10px;position:relative;z-index:40;}
#tabs button{background:none;color:var(--dim);padding:8px 2px;border-radius:0;font-size:13.5px;border-bottom:2px solid transparent;}
#tabs button:hover{color:var(--text);background:none;}
#tabs button.active{color:var(--text);border-bottom-color:var(--red);}
main{padding:0 0 60px;}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px;}

/* ---------- hero ---------- */
#hero{position:relative;min-height:44vh;overflow:hidden;margin-bottom:18px;display:flex;align-items:center;}
#hero-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(42px) brightness(.5) saturate(1.35);transform:scale(1.15);}
#hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(10,10,12,.05) 0%, rgba(10,10,12,.72) 68%, var(--bg) 100%), linear-gradient(90deg, rgba(10,10,12,.55) 0%, rgba(10,10,12,.05) 55%);}
.hero-content{position:relative;z-index:2;display:flex;align-items:flex-end;gap:32px;padding:44px 32px;max-width:1280px;margin:0 auto;width:100%;box-sizing:border-box;}
.hero-cover{width:190px;height:281px;flex:0 0 auto;border-radius:8px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.08);background:#000;display:flex;align-items:center;justify-content:center;}
.hero-cover img{width:100%;height:100%;object-fit:contain;display:block;}
.hero-cover .cover-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;text-align:center;padding:14px;color:#fff;}
.hero-body{position:relative;max-width:560px;}
.hero-body .eyebrow{font-family:'JetBrains Mono',monospace;color:var(--yellow);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.hero-body h1{font-size:48px;line-height:1;margin:0 0 10px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5);}
.hero-body p{color:#ddd8cc;font-size:15px;line-height:1.5;margin-bottom:18px;}
.genre-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.pill{font-size:11px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;border:1px solid #555145;color:var(--dim);padding:3px 10px;border-radius:20px;}
.hero-actions{display:flex;gap:10px;}

/* ---------- rows ---------- */
.row{margin-bottom:34px;}
.row-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 32px;margin-bottom:10px;}
.row-head h2{font-size:19px;margin:0;color:var(--text);font-family:'Inter',sans-serif;font-weight:800;}
.row-track{display:flex;gap:14px;overflow-x:auto;padding:6px 32px 14px;scroll-behavior:smooth;}
.poster-card{
  flex:0 0 auto;width:160px;cursor:pointer;
}
.poster-card .art{
  width:160px;height:224px;border-radius:6px;overflow:hidden;background:var(--card);
  border:1px solid #2c2a26;position:relative;transition:transform .15s ease, box-shadow .15s ease;
}
.poster-card:hover .art{transform:scale(1.045) translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.55);}
.poster-card img{width:100%;height:100%;object-fit:cover;display:block;}
.poster-card .cover-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.5px;text-align:center;padding:10px;color:#fff;}
.poster-card .badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);color:#fff;font-size:10.5px;
  font-family:'JetBrains Mono',monospace;padding:2px 6px;border-radius:3px;}
.poster-card .badge.read{background:var(--green);}
.poster-card .badge.owned{background:var(--cyan);}
.poster-card .t{font-size:12.5px;font-weight:700;margin-top:7px;line-height:1.3;}
.poster-card .s{font-size:11px;color:var(--dim2);margin-top:1px;}
.add-tile{
  flex:0 0 auto;width:160px;height:224px;border:1.5px dashed #4a4740;border-radius:6px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--dim);cursor:pointer;
}
.add-tile:hover{color:var(--text);border-color:#6a655a;}

/* ---------- users directory ---------- */
#view-users{max-width:820px;margin:50px auto;text-align:center;}
#view-users h1{font-size:40px;color:var(--red);margin-bottom:4px;}
#view-users p{color:var(--dim);margin-top:0;margin-bottom:34px;}
.profile-grid{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;}
#view-auth{max-width:420px;margin:70px auto;text-align:center;}
#view-auth h1{font-size:56px;color:var(--red);margin-bottom:4px;}
#view-auth p{color:var(--dim);margin-top:0;margin-bottom:28px;}
body.read-only .owner-only{display:none !important;}
.you-badge{font-size:10px;background:var(--green);color:#fff;padding:2px 6px;border-radius:3px;margin-top:4px;display:inline-block;}

/* ---------- single profile page ---------- */
#view-profile{padding-top:26px;}
.profile-header{display:flex;align-items:flex-start;gap:22px;padding:0 32px;margin:16px 0 30px;flex-wrap:wrap;}
.profile-avatar{width:96px;height:96px;border-radius:16px;font-size:32px;font-weight:800;color:#fff;background-size:cover !important;background-position:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.profile-meta{flex:1;min-width:220px;}
.profile-meta h1{margin:0 0 4px;font-size:34px;}
.profile-bio{color:var(--dim);font-size:14px;margin:0 0 14px;max-width:520px;}
.profile-stats{display:flex;gap:26px;}
.profile-stats div{display:flex;flex-direction:column;}
.profile-stats b{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;}
.profile-stats span{font-size:10.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em;}
.profile-card{width:140px;cursor:pointer;position:relative;text-align:center;}
.profile-card .big-avatar{
  width:100px;height:100px;border-radius:10px;margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:800;
  border:2px solid transparent;transition:border-color .12s ease, transform .12s ease;
}
.profile-card:hover .big-avatar{border-color:#fff;transform:scale(1.04);}
.profile-card .pname{font-weight:600;color:var(--dim);}
.profile-card:hover .pname{color:var(--text);}
.profile-card .del{
  position:absolute;top:-6px;right:14px;background:none;border:none;color:#c05a4d;font-size:18px;padding:2px 6px;
}
.new-profile-card{width:140px;display:flex;flex-direction:column;align-items:center;color:var(--dim);cursor:pointer;}
.new-profile-card .big-avatar{width:100px;height:100px;border-radius:10px;border:2px dashed #4a4740;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:10px;}
.new-profile-card:hover{color:var(--text);}
.new-profile-card:hover .big-avatar{border-color:#8a8578;}

/* ---------- panel / detail pages ---------- */
.panel{background:var(--card);border:var(--line);border-radius:8px;padding:24px;margin:0 0 22px;}
.backbtn{margin:18px 0 14px;}
.cover-tall{width:180px;border-radius:6px;display:block;}
.cover-fallback-tall{width:180px;aspect-ratio:2/3;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;text-align:center;padding:10px;color:#fff;}

.issue-row{
  display:flex;align-items:center;gap:14px;border:var(--line);border-radius:6px;
  padding:12px 16px;margin-bottom:10px;background:var(--card);cursor:pointer;
}
.issue-row:hover{background:var(--bg3);}
.issue-row .it{flex:1;}
.issue-row .it .tt{font-weight:700;}
.issue-row .it .dd{font-size:11.5px;color:var(--dim2);}
.burst{
  width:44px;height:44px;background:var(--yellow);color:#181614;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:'Permanent Marker',cursive;
  font-size:14px;flex-shrink:0;transform:rotate(-4deg);
}
.tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 8px;border-radius:10px;}
.tag.read{background:var(--green);color:#fff;}
.tag.owned{background:var(--cyan);color:#fff;}

.issue-hero{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;}
.issue-hero .cover-col{width:340px;flex-shrink:0;}
.issue-cover-frame{
  position:relative;width:100%;aspect-ratio:2/3;border-radius:12px;overflow:hidden;
  background:#000;box-shadow:0 22px 46px rgba(0,0,0,.55);border:1px solid #34322d;
  cursor:zoom-in;transition:transform .18s ease, box-shadow .18s ease;
}
.issue-cover-frame:hover{transform:translateY(-3px);box-shadow:0 28px 56px rgba(0,0,0,.65);}
.issue-cover-frame img{width:100%;height:100%;object-fit:cover;display:block;}
.issue-cover-frame .cover-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.5px;text-align:center;padding:16px;color:#fff;}
.variant-flag{
  position:absolute;top:10px;left:10px;background:rgba(10,10,12,.82);color:var(--yellow);
  font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  padding:5px 10px;border-radius:20px;border:1px solid rgba(242,183,5,.4);
  display:flex;align-items:center;gap:6px;cursor:pointer;
}
.variant-flag:hover{background:rgba(10,10,12,.95);}
.variant-strip{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap;}
.variant-strip img{
  width:56px;height:84px;object-fit:cover;border-radius:4px;cursor:pointer;
  border:2px solid #3a372f;transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.variant-strip img:hover{transform:translateY(-3px);border-color:#6b675b;}
.variant-strip img.active{border-color:var(--yellow);box-shadow:0 4px 14px rgba(0,0,0,.5);}
.info-col{flex:1;min-width:280px;}
.info-col h2{font-size:30px;margin:0 0 2px;color:#fff;}
.info-col .subtitle{color:var(--dim2);margin-bottom:14px;}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 10px;font-size:13.5px;margin-bottom:14px;}
.kv div:nth-child(odd){font-weight:700;color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;align-self:center;}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px;}
.actions-row button.active{background:var(--green);color:#fff;}
.actions-row button.active.owned-btn{background:var(--cyan);}

/* ---------- heroes: detail page ---------- */
.hero-hero{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;}
.hero-portrait-col{width:220px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:12px;}
.hero-portrait-frame{
  position:relative;width:200px;height:200px;border-radius:50%;overflow:hidden;
  background:#000;box-shadow:0 18px 40px rgba(0,0,0,.5);flex-shrink:0;
}
.hero-portrait-frame img{width:100%;height:100%;object-fit:cover;display:block;}
.hero-portrait-frame .cover-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:34px;color:#fff;}
.hero-portrait-frame.aff-hero{box-shadow:0 0 0 4px var(--cyan), 0 18px 40px rgba(0,0,0,.5);}
.hero-portrait-frame.aff-villain{box-shadow:0 0 0 4px var(--red), 0 18px 40px rgba(0,0,0,.5);}
.hero-portrait-frame.aff-anti{box-shadow:0 0 0 4px #9463d9, 0 18px 40px rgba(0,0,0,.5);}
.hero-affiliation-pill{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:5px 14px;border-radius:20px;}
.hero-affiliation-pill.aff-hero{background:rgba(51,161,201,.18);color:var(--cyan);border:1px solid rgba(51,161,201,.4);}
.hero-affiliation-pill.aff-villain{background:rgba(224,57,44,.18);color:var(--red);border:1px solid rgba(224,57,44,.4);}
.hero-affiliation-pill.aff-anti{background:rgba(148,99,217,.18);color:#b79bec;border:1px solid rgba(148,99,217,.4);}
.power-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px;}
.power-tags .tag2{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:#2c2a26;color:var(--dim);border:1px solid #3a372f;}

/* ---------- hero signature quote ---------- */
.hero-quote{
  margin:14px 0 18px;padding:10px 0 10px 16px;border-left:3px solid var(--dim2);
  font-size:19px;line-height:1.5;
}
.hero-quote .hq-mark{font-family:'Bebas Neue',sans-serif;font-size:26px;opacity:.7;}
.hero-quote .hq-text{}
#hero-fav-btn.fav-active{background:var(--yellow);color:#1c1a17;}

/* ---------- favorite character card (profile page) ---------- */
.fav-hero-card{
  display:flex;gap:16px;align-items:center;margin:18px 0;padding:16px;
  background:var(--card);border:1px solid var(--dim2);border-left-width:4px;border-radius:10px;
  transition:transform .12s ease;
}
.fav-hero-card:hover{transform:translateY(-2px);}
.fh-portrait{width:64px;height:64px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#000;}
.fh-portrait img{width:100%;height:100%;object-fit:cover;display:block;}
.fh-portrait .cover-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;}
.fh-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;margin-bottom:2px;}
.fh-name{font-size:17px;font-weight:800;}
.fh-alias{font-weight:500;color:var(--dim);font-size:14px;}
.fh-quote{font-size:15px;margin-top:4px;line-height:1.4;}

.stat-grid{display:grid;gap:8px;max-width:420px;}
.stat-row{display:grid;grid-template-columns:82px 1fr 26px;align-items:center;gap:10px;}
.stat-row .stat-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;}
.stat-row .stat-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim2);text-align:right;}
.stat-track{height:9px;border-radius:5px;background:#232019;overflow:hidden;}
.stat-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--red),var(--yellow));width:0;transition:width 1s cubic-bezier(.22,1,.36,1);}

.hero-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px;}
.hero-chip{
  display:flex;align-items:center;gap:7px;background:#211f1c;border:1px solid #3a372f;border-radius:20px;
  padding:4px 12px 4px 4px;cursor:pointer;transition:border-color .12s ease, transform .12s ease;font-size:12.5px;font-weight:600;
}
.hero-chip:hover{border-color:#6b675b;transform:translateY(-2px);}
.hero-chip .hc-dot{width:22px;height:22px;border-radius:50%;color:#fff;font-size:9.5px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;overflow:hidden;}
.hero-chip .hc-dot img{width:100%;height:100%;object-fit:cover;}

/* ---------- heroes: grid / list ---------- */
.heroes-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.heroes-toolbar input{max-width:240px;}
.aff-filter{display:flex;gap:6px;}
.aff-filter button{background:#211f1c;border:1px solid #3a372f;padding:7px 13px;font-size:11.5px;}
.aff-filter button.active{background:var(--red);border-color:var(--red);color:#fff;}
.heroes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;}
.hero-card{background:var(--card);border:var(--line);border-radius:10px;padding:16px 12px;text-align:center;cursor:pointer;
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;position:relative;}
.hero-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.45);border-color:#4a4740;}
.hero-card .hc-portrait{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;overflow:hidden;background:#000;}
.hero-card .hc-portrait img{width:100%;height:100%;object-fit:cover;display:block;}
.hero-card .hc-portrait .cover-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;}
.hero-card .hc-name{font-weight:700;font-size:13.5px;}
.hero-card .hc-alias{font-size:11px;color:var(--dim2);margin-top:1px;}
.hero-card .hc-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim2);margin-top:6px;}
.hero-card .hc-crown{position:absolute;top:8px;right:10px;font-size:16px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));}

/* ---------- heroes: appearance rows + team-ups ---------- */
.appearance-row{display:flex;align-items:center;gap:14px;border:var(--line);border-radius:6px;padding:10px 14px;margin-bottom:8px;background:var(--card);cursor:pointer;}
.appearance-row:hover{background:var(--bg3);}
.appearance-row .ar-cover{width:40px;height:60px;border-radius:4px;overflow:hidden;flex-shrink:0;background:#000;}
.appearance-row .ar-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.appearance-row .ar-cover .cover-fallback{width:100%;height:100%;font-size:8px;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;}
.first-appearance-badge{font-family:'Permanent Marker',cursive;font-size:11px;color:var(--yellow);transform:rotate(-3deg);margin-left:auto;flex-shrink:0;}
.teamup-chip{display:inline-flex;align-items:center;gap:8px;background:#211f1c;border:1px solid #3a372f;border-radius:20px;padding:5px 14px 5px 5px;margin:0 8px 8px 0;cursor:pointer;transition:transform .12s ease,border-color .12s ease;}
.teamup-chip:hover{transform:translateY(-2px);border-color:#6b675b;}
.teamup-chip .tc-dot{width:26px;height:26px;border-radius:50%;overflow:hidden;background:#000;flex-shrink:0;}
.teamup-chip .tc-dot img{width:100%;height:100%;object-fit:cover;}
.teamup-chip .tc-dot .cover-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;}
.teamup-chip .tc-n{font-size:12px;font-weight:700;}
.teamup-chip .tc-c{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim2);}

/* ---------- hero picker (used in issue add/edit forms) ---------- */
.hero-picker{display:flex;flex-wrap:wrap;gap:7px;max-height:150px;overflow:auto;border:1.5px solid #45423a;border-radius:6px;padding:9px;background:#0f0e0c;}
.hero-check{display:flex;align-items:center;gap:6px;background:#211f1c;border:1px solid #3a372f;border-radius:20px;padding:5px 11px 5px 8px;font-size:12px;cursor:pointer;user-select:none;}
.hero-check input{width:auto;padding:0;margin:0;accent-color:var(--red);}
.hero-check.checked{border-color:var(--yellow);}

.section-title{font-size:19px;font-weight:800;border-bottom:var(--line);padding-bottom:8px;margin:26px 0 14px;display:flex;justify-content:space-between;align-items:center;}
.review-card{border:var(--line);border-radius:6px;padding:14px 16px;margin-bottom:10px;background:var(--card);}
.review-card .rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.stars{color:var(--yellow);letter-spacing:2px;font-size:14px;}
.who-list{display:flex;flex-wrap:wrap;gap:8px;}
.who-chip{display:flex;align-items:center;gap:6px;border:var(--line);border-radius:20px;padding:4px 12px 4px 4px;font-size:12.5px;font-weight:600;}
.who-chip .dot{width:20px;height:20px;border-radius:5px;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800;}

.empty{color:var(--dim2);font-style:italic;padding:16px 0;}

/* ---------- reading progress ring ---------- */
.progress-ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0;}
.progress-ring{width:100%;height:100%;transform:rotate(-90deg);display:block;}
.ring-track{fill:none;stroke:#2a2822;stroke-width:9;}
.ring-fill{fill:none;stroke:var(--red);stroke-width:9;stroke-linecap:round;
  transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1), stroke .3s ease;}
.ring-fill.complete{stroke:var(--green);}
.progress-ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.progress-ring-pct{font-family:'Bebas Neue',sans-serif;font-size:17px;color:#fff;line-height:1;}
.progress-ring-sub{font-size:8.5px;color:var(--dim2);font-family:'JetBrains Mono',monospace;margin-top:1px;}
.progress-ring-wrap.pulse{animation:ringPulse .6s ease;}
@keyframes ringPulse{0%{transform:scale(1);}40%{transform:scale(1.14);}100%{transform:scale(1);}}

/* ---------- star rating hover preview ---------- */
.star-picker span{display:inline-block;transition:color .12s ease, transform .12s ease;}
.star-picker span:hover{transform:scale(1.2) rotate(-4deg);}
.star-picker span.pop{animation:starPop .35s ease;}
@keyframes starPop{0%{transform:scale(1);}35%{transform:scale(1.5) rotate(-8deg);}100%{transform:scale(1);}}
.star-picker-label{font-family:'Permanent Marker',cursive;font-size:15px;color:var(--yellow);margin-top:4px;min-height:18px;transform:rotate(-2deg);}

/* ---------- comic bursts + confetti ---------- */
.comic-burst{
  position:fixed;z-index:300;pointer-events:none;font-family:'Permanent Marker',cursive;
  font-size:26px;text-shadow:2px 2px 0 rgba(0,0,0,.55);white-space:nowrap;
  animation:burstFloat 1s ease forwards;
  --rot:-8deg;
}
@keyframes burstFloat{
  0%{transform:translate(-50%,-50%) scale(.4) rotate(var(--rot));opacity:0;}
  15%{transform:translate(-50%,-70%) scale(1.15) rotate(var(--rot));opacity:1;}
  30%{transform:translate(-50%,-78%) scale(1) rotate(var(--rot));opacity:1;}
  100%{transform:translate(-50%,-140%) scale(1) rotate(var(--rot));opacity:0;}
}
.confetti-piece{position:fixed;top:-20px;z-index:299;pointer-events:none;border-radius:2px;
  animation:confettiFall linear forwards;}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(110vh) rotate(600deg);opacity:.9;}
}
.complete-banner{
  position:fixed;top:26px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:301;
  background:linear-gradient(135deg,var(--red),#b8291d);color:#fff;padding:16px 28px;border-radius:10px;
  box-shadow:0 20px 50px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.15);
  display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;
  animation:bannerIn .5s cubic-bezier(.2,1.4,.4,1) forwards, bannerOut .5s ease forwards 2.6s;
}
.complete-banner .cb-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;}
.complete-banner .cb-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.85);margin-top:2px;}
@keyframes bannerIn{0%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(.85);}60%{opacity:1;transform:translateX(-50%) translateY(4px) scale(1.03);}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}}
@keyframes bannerOut{to{opacity:0;transform:translateX(-50%) translateY(-16px) scale(.95);}}

/* micro pop feedback on action buttons */
.actions-row button.active{animation:btnPop .35s ease;}
@keyframes btnPop{0%{transform:scale(1);}40%{transform:scale(1.08);}100%{transform:scale(1);}}

/* ---------- cover lightbox ---------- */
.lightbox-overlay{
  position:fixed;inset:0;background:rgba(6,6,7,.9);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:40px;cursor:zoom-out;
}
.lightbox-overlay img{max-width:min(88vw,560px);max-height:86vh;border-radius:10px;box-shadow:0 30px 70px rgba(0,0,0,.7);}
.lightbox-close{position:absolute;top:22px;right:28px;background:rgba(255,255,255,.08);border:1px solid #4a4740;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.lightbox-close:hover{background:rgba(255,255,255,.16);}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding:50px 16px;z-index:100;overflow:auto;}
.modal{background:var(--bg2);border:var(--line);border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.6);padding:24px;max-width:460px;width:100%;}
.modal h3{margin-top:0;color:#fff;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
.star-picker{display:flex;gap:4px;font-size:26px;cursor:pointer;}
.star-picker span{color:#3a372f;}
.star-picker span.on{color:var(--yellow);}
.import-note{font-size:11.5px;color:var(--dim2);border-left:2px solid #4a4740;padding-left:10px;margin-top:10px;}
.color-swatches{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid transparent;}
.swatch.sel{border-color:#fff;}
footer.indicia{max-width:1280px;margin:0 auto;padding:10px 32px 40px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim2);text-align:center;}
.danger-btn{color:var(--red)!important;border-color:var(--red)!important;}
.danger-btn:hover{background:rgba(224,57,44,.12)!important;}

/* ---------- logo easter egg ---------- */
#topbar .logo{cursor:pointer;user-select:none;transition:transform .12s ease;}
#topbar .logo:active{transform:scale(.94);}

/* ---------- currency pill ---------- */
.currency-pill, #who-currency{
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
  background:rgba(242,183,5,.12);color:var(--yellow);border:1px solid rgba(242,183,5,.35);

}
.ach-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
.ach-header .currency-pill{font-size:15px;padding:9px 16px;}

/* ---------- shop ---------- */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:14px 0 28px;}
.shop-card{background:var(--card);border:var(--line);border-radius:10px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;}
.shop-card.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset;}
.shop-swatch{width:100%;height:54px;border-radius:6px;}
.frame-preview-avatar{width:54px;height:54px;border-radius:50%;background:#2c2a26;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;}
.shop-name{font-weight:700;font-size:13px;}
.shop-card button{width:100%;}

/* ---------- badges ---------- */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin:14px 0 40px;}
.badge-card{background:var(--card);border:var(--line);border-left:4px solid #3a372f;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;}
.badge-card.locked{opacity:.55;}
.badge-card.unlocked.tier-bronze{border-left-color:#a5673f;}
.badge-card.unlocked.tier-silver{border-left-color:#c7cbd1;}
.badge-card.unlocked.tier-gold{border-left-color:#f2c94c;}
.badge-icon{font-size:26px;line-height:1;}
.badge-name{font-weight:800;font-size:14px;}
.badge-desc{font-size:12px;color:var(--dim);line-height:1.4;flex:1;}
.badge-progress{height:6px;border-radius:3px;background:#2c2a26;overflow:hidden;}
.badge-progress-fill{height:100%;background:var(--cyan);}
.badge-progress-label{font-size:10.5px;color:var(--dim2);}
.badge-reward{font-size:11px;color:var(--yellow);}

/* ---------- achievement toast ---------- */
.achievement-toast{
  position:fixed;right:20px;bottom:20px;z-index:400;
  background:var(--bg2);border:1.5px solid var(--yellow);border-radius:10px;
  padding:12px 16px;display:flex;align-items:center;gap:12px;max-width:300px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
  animation:toastIn .35s cubic-bezier(.2,1.4,.4,1);
}
.achievement-toast.out{animation:toastOut .4s ease forwards;}
@keyframes toastIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes toastOut{to{transform:translateX(30px);opacity:0;}}
.at-icon{font-size:28px;}
.at-title{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim2);font-weight:700;}
.at-name{font-weight:800;font-size:14px;}
.at-reward{font-size:11.5px;color:var(--yellow);margin-top:2px;}
@media (max-width:640px){
  .achievement-toast{left:16px;right:16px;max-width:none;}
}
@media (max-width:640px){
  #topbar{padding:14px 16px 22px;}
  #tabs{padding:0 16px;gap:14px;}
  .wrap{padding:0 16px;}
  #hero .hero-body{padding:0 16px 30px;}
  .row-head{padding:0 16px;}
  .row-track{padding:6px 16px 14px;}
  #hero h1{font-size:36px;}
  .kv{grid-template-columns:100px 1fr;}
  .issue-hero .cover-col{width:100%;max-width:340px;margin:0 auto;}
}
</style>
</head>

<main>

    const snap = await getDoc(doc(db,'kv',key));
    return snap.exists() ? snap.data().value : null;
  }catch(e){ console.warn('sGet failed', key, e.code||e.message, e); return null; }
}
async function sSet(key, val){
  try{ await setDoc(doc(db,'kv',key), {value: val}); return true; }
  catch(e){
    console.error('sSet failed for key "'+key+'":', e.code||e.message, e);
    alert('Could not save — '+(e.code||e.message||'unknown error')+'. Check your connection and Firestore rules.');
    return false;
  }
}
async function sDel(key){
  try{ await deleteDoc(doc(db,'kv',key)); }catch(e){ console.warn('sDel failed', key, e.code||e.message, e); }
}

function heroQuoteColor(h){ return (h && h.quoteColor) || colorFor(h ? h.id : 'x'); }
function colorFor(seed){
  let h=0; for(const c of String(seed)) h = (h*31 + c.charCodeAt(0))>>>0;
  return PALETTE[h % PALETTE.length];
}

  if(!pd) return null;
  const sfHeroId = pd.achievements && pd.achievements.superfan && pd.achievements.superfan.heroId;
  const hid = sfHeroId || pd.favoriteHeroId;
  return hid ? findHero(hid) : null;
}
function applyTheme(themeId){
  const t = THEMES[themeId] || THEMES.midnight;
  const root = document.documentElement.style;
  Object.entries(t.vars).forEach(([k,v])=> root.setProperty('--'+k, v));
  if(t.dynamicHero && currentUser){
    const hero = getSuperfanHero(state.profileData[currentUser.uid]);
    if(hero && hero.quoteColor){
      root.setProperty('--red', hero.quoteColor);
      root.setProperty('--cyan', hero.quoteColor);
    }
  }
  document.body.dataset.theme = themeId;
}

/* build the stats context achievements are checked against */
async function buildAchievementContext(pd){
  const ctx = {
    totalRead: pd.read.length,
    collectionCount: pd.collection.length,
    reviewsCount: Object.keys(pd.reviews||{}).length,
    genreCounts:{}, heroCounts:{}, pairCounts:{}, seriesCompleted:0, villainReadCount:0, antiReadCount:0,
    fiveStar:false, oneStar:false
  };
  const bySeries = {};
  pd.read.forEach(r=>{ (bySeries[r.seriesId] = bySeries[r.seriesId]||[]).push(r.issueId); });
  for(const [seriesId, issueIds] of Object.entries(bySeries)){
    const issues = await getIssues(seriesId);
    const series = findSeries(seriesId);
    if(issues.length && issueIds.length>=issues.length) ctx.seriesCompleted++;
    for(const iid of issueIds){
      const iss = issues.find(i=>i.id===iid);
      if(!iss) continue;
      (series?.genres||[]).forEach(g=>{ ctx.genreCounts[g]=(ctx.genreCounts[g]||0)+1; });
      const hids = iss.heroIds||[];
      hids.forEach(hid=>{
        ctx.heroCounts[hid]=(ctx.heroCounts[hid]||0)+1;
        const hero = findHero(hid);
        if(hero && hero.affiliation==='villain') ctx.villainReadCount++;
        if(hero && hero.affiliation==='anti') ctx.antiReadCount++;
      });
      for(let i=0;i<hids.length;i++){
        for(let j=i+1;j<hids.length;j++){
          const key = [hids[i],hids[j]].sort().join('|');
          ctx.pairCounts[key] = (ctx.pairCounts[key]||0)+1;
        }
      }
    }
  }
  ctx.distinctGenres = Object.keys(ctx.genreCounts).length;
  ctx.distinctHeroes = Object.keys(ctx.heroCounts).length;
  ctx.maxGenreCount = Object.values(ctx.genreCounts).reduce((m,v)=>Math.max(m,v),0);
  ctx.maxHeroCount = Object.values(ctx.heroCounts).reduce((m,v)=>Math.max(m,v),0);
  ctx.maxHeroId = Object.entries(ctx.heroCounts).reduce((best,[hid,v])=> v>best.v?{hid,v}:best, {hid:null,v:0}).hid;
  ctx.maxPairCount = Object.values(ctx.pairCounts).reduce((m,v)=>Math.max(m,v),0);
  Object.values(pd.reviews||{}).forEach(r=>{ if(r.rating===5) ctx.fiveStar=true; if(r.rating===1) ctx.oneStar=true; });
  return ctx;
}

/* checks every achievement, unlocks + pays out any newly-earned ones, toasts them */
async function checkAchievements(uid){
  if(!uid) return [];
  const pd = await getProfileData(uid);
  const ctx = await buildAchievementContext(pd);
  const newlyUnlocked = [];
  for(const a of ACHIEVEMENTS){
    if(pd.achievements[a.id]) continue;
    let result;
    try{ result = a.check(ctx, pd); }catch(e){ continue; }
    if(result && result.unlocked){
      pd.achievements[a.id] = {unlockedAt: Date.now()};
      if(a.id==='superfan') pd.achievements[a.id].heroId = ctx.maxHeroId;
      pd.currency = (pd.currency||0) + a.reward;
      pd.stats.totalInkEarned = (pd.stats.totalInkEarned||0) + a.reward;
      newlyUnlocked.push(a);
    }
  }
  if(newlyUnlocked.length){
    await saveProfileData(uid);
    updateCurrencyBadge();
    newlyUnlocked.forEach((a,i)=> setTimeout(()=>showAchievementToast(a), i*450));
  }
  return newlyUnlocked;
}
function showAchievementToast(a){
  const el = document.createElement('div');
  el.className = 'achievement-toast';
  el.innerHTML = `<div class="at-icon">${a.icon}</div><div class="at-body"><div class="at-title">Achievement Unlocked</div><div class="at-name">${escapeHtml(a.name)}</div><div class="at-reward">+${a.reward} 🖋️ Ink</div></div>`;
  document.body.appendChild(el);
  if(a.tier==='gold') fireConfetti(70);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),420); }, 3800);
}

const KONAMI = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];

  const key = e.key.length===1 ? e.key.toLowerCase() : e.key.toLowerCase();

  typedBuffer = typedBuffer.slice(-20);

  if(typedBuffer.endsWith('flame on')) triggerFlameOn();
});

/* every issue across every series that tags this hero, newest series data pulled from cache/storage */
async function getHeroAppearances(heroId){
  const out = [];
  for(const series of state.seriesIndex){
    const issues = await getIssues(series.id);
    for(const iss of issues){
      if((iss.heroIds||[]).includes(heroId)) out.push({series, issue: iss});
    }
  }
  out.sort((a,b)=> (a.issue.publishDate||'9999').localeCompare(b.issue.publishDate||'9999'));
  return out;
}
/* other heroes who share at least one issue with this hero, ranked by shared-issue count */
async function getHeroTeamUps(heroId){
  const appearances = await getHeroAppearances(heroId);
  const counts = {};
  appearances.forEach(a=>{
    (a.issue.heroIds||[]).forEach(id=>{
      if(id===heroId) return;
      counts[id] = (counts[id]||0)+1;
    });
  });
  return Object.entries(counts).map(([id,count])=>({hero: findHero(id), count})).filter(x=>x.hero).sort((a,b)=>b.count-a.count);
}

      state.profileData[cred.user.uid] = emptyProfileData();
      await saveProfileData(cred.user.uid);
      // onAuthStateChanged fires automatically and takes it from here
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  }catch(e){
    errEl.textContent = (e && e.message) ? e.message.replace(/^Firebase:\s*/,'') : 'Something went wrong.';
  }
}
async function doSignOut(){
  applyTheme('midnight');
  await signOut(auth);
}

async function renderProfilePage(uid){
  let p = state.profiles.find(x=>x.id===uid);
  if(!p){ state.profiles = await fetchAllUsers(); p = state.profiles.find(x=>x.id===uid); }
  const body = document.getElementById('profile-body');
  if(!p){ body.innerHTML = '<div class="wrap"><div class="empty">User not found.</div></div>'; return; }

  const pd = await getProfileData(uid);
  const isOwner = currentUser && uid===currentUser.uid;
  const reviewEntries = Object.entries(pd.reviews||{});
  const avg = reviewEntries.length ? reviewEntries.reduce((a,[,r])=>a+r.rating,0)/reviewEntries.length : 0;
  const frame = FRAMES[pd.frame] || FRAMES.none;
  const unlockedBadges = ACHIEVEMENTS.filter(a=>pd.achievements && pd.achievements[a.id]);

  await getHeroes(); // make sure heroesIndex is populated before we look up the favorite
  const favHero = pd.favoriteHeroId ? findHero(pd.favoriteHeroId) : null;
  let favHeroBlock = '';
  if(favHero){
    const qs = heroQuoteStyle(favHero);
    const qc = heroQuoteColor(favHero);
    favHeroBlock = `
      <div class="fav-hero-card" style="border-color:${qc};cursor:pointer;" onclick="openHero('${favHero.id}')">
        <div class="fh-portrait">${coverOrFallback(favHero.imageUrl, initials(favHero.name), favHero.id)}</div>
        <div class="fh-info">
          <div class="fh-label mono" style="color:${qc};">★ FAVORITE CHARACTER</div>
          <div class="fh-name">${escapeHtml(favHero.name)}${favHero.alias?` <span class="fh-alias">"${escapeHtml(favHero.alias)}"</span>`:''}</div>
          ${favHero.bio ? `<div class="fh-quote" style="font-family:${qs.font};font-style:${qs.fontStyle};letter-spacing:${qs.letterSpacing};color:${qc};">&ldquo;${escapeHtml(favHero.bio)}&rdquo;</div>` : ''}
        </div>
      </div>`;
  }

  body.innerHTML = `
    <div class="wrap">
      <button class="backbtn ghost small" onclick="setTab('home')">&larr; Back</button>
      <div class="profile-header">
        <div class="big-avatar profile-avatar" style="background:${p.color};${p.avatarUrl?`background-image:url('${escapeAttr(p.avatarUrl)}')`:''};box-shadow:${frame.css};">${p.avatarUrl?'':initials(p.name)}</div>
        <div class="profile-meta">
          <h1>${escapeHtml(p.name)}</h1>
          ${p.bio? `<p class="profile-bio">${escapeHtml(p.bio)}</p>` : ''}
          <div class="profile-stats">
            <div><b>${pd.read.length}</b><span>Read</span></div>
            <div><b>${pd.collection.length}</b><span>Owned</span></div>
            <div><b>${reviewEntries.length}</b><span>Reviews</span></div>
            <div><b>${avg? avg.toFixed(1) : '–'}</b><span>Avg Rating</span></div>
            <div><b>${unlockedBadges.length}</b><span>Badges</span></div>
          </div>
        </div>
        ${isOwner? `<button class="ghost small" onclick="openEditProfile()">Edit profile</button>` : ''}
      </div>
      ${favHeroBlock}
      ${unlockedBadges.length ? `<div class="section-title">Badges</div><div class="badge-grid">${unlockedBadges.slice(0,8).map(a=>`<div class="badge-card unlocked tier-${a.tier}" style="padding:10px;"><div class="badge-icon" style="font-size:20px;">${a.icon}</div><div class="badge-name" style="font-size:12.5px;">${escapeHtml(a.name)}</div></div>`).join('')}</div>` : ''}
      <div class="section-title">Reviews</div>
      <div class="panel" id="profile-reviews-panel"></div>
      <div id="profile-shelves"></div>
    </div>
  `;

  const revPanel = document.getElementById('profile-reviews-panel');
  if(!reviewEntries.length){
    revPanel.innerHTML = '<div class="empty">No reviews yet.</div>';
  } else {
    revPanel.innerHTML = '';
    for(const [issueId, rev] of reviewEntries.sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0))){
      const series = findSeries(rev.seriesId);
      if(!series) continue;
      const issues = await getIssues(rev.seriesId);
      const iss = issues.find(x=>x.id===issueId);
      if(!iss) continue;
      const card = document.createElement('div');
      card.className='review-card';
      card.style.cursor='pointer';
      card.innerHTML = `
        <div class="rhead">
          <div class="tt" style="font-weight:700;">${escapeHtml(series.title)} #${iss.number}${iss.title? ' — '+escapeHtml(iss.title):''}</div>
          <div class="stars">${'★'.repeat(rev.rating)}${'☆'.repeat(5-rev.rating)}</div>
        </div>
        <div style="color:var(--dim);">${escapeHtml(rev.text)||'<span class="empty">No written review, just a rating.</span>'}</div>
      `;
      card.onclick = ()=>jumpToIssue(rev.seriesId, issueId);
      revPanel.appendChild(card);
    }
  }

  const shelves = document.getElementById('profile-shelves');
  shelves.innerHTML = '';
  if(pd.read.length) shelves.appendChild(await buildIssueRow('Read', pd.read, pd));
  if(pd.toRead.length) shelves.appendChild(await buildIssueRow('To Read', pd.toRead, pd));
  if(pd.collection.length) shelves.appendChild(await buildIssueRow('Physical Collection', pd.collection, pd));
  if(!pd.read.length && !pd.toRead.length && !pd.collection.length){
    shelves.innerHTML = '<div class="empty" style="padding:0 32px;">No lists yet.</div>';
  }
}

    document.getElementById('view-'+v).classList.toggle('hidden', v!==name);

function setTab(tab){

  [...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='users'){ goUsers(); return; }
  showView('home');

  else if(tab==='mylist') renderSimpleList('toRead','My List','Nothing on your list yet. Open any issue and hit "Add to My List."');
  else if(tab==='collection') renderSimpleList('collection','Physical Collection','No issues marked as owned yet. Open an issue and hit "Add to Physical Collection."');

  else if(tab==='achievements') renderAchievementsTab();

  return fallbackHtml(title, seed);
}

}

async function renderHomeTab(){

      <button class="primary" onclick="openAddSeries()">+ Add series</button>

    return;
  }

  const term = (state.searchTerm||'').trim().toLowerCase();
  if(term){
    const matches = state.seriesIndex.filter(s=>s.title.toLowerCase().includes(term) || (s.publisher||'').toLowerCase().includes(term) || (s.genres||[]).some(g=>g.toLowerCase().includes(term)));
    body.innerHTML = `<div class="wrap" style="padding-top:34px;">
      <div class="section-title">Results for "${escapeHtml(state.searchTerm)}"</div>
      ${matches.length ? '' : '<div class="empty">No series match that search.</div>'}
      <div class="grid-results" style="display:flex;flex-wrap:wrap;gap:16px;"></div>
    </div>`;
    const resWrap = body.querySelector('.grid-results');
    matches.forEach(s=>{
      const card = document.createElement('div');
      card.className='poster-card';
      card.innerHTML = `<div class="art">${coverOrFallback(s.coverUrl, s.title, s.id)}</div>
        <div class="t">${escapeHtml(s.title)}</div><div class="s">${escapeHtml(s.publisher||'')}</div>`;
      card.onclick = ()=>openSeries(s.id);
      resWrap.appendChild(card);
    });
    return;
  }

  const pd = await getProfileData(state.currentProfileId);

  // hero: most recently added series
  const featured = state.seriesIndex.slice().sort((a,b)=>(b.addedAt||0)-(a.addedAt||0))[0];
  const hasCover = !!featured.coverUrl;
  const bgStyle = hasCover
    ? `background-image:url('${escapeAttr(featured.coverUrl)}')`
    : `background:linear-gradient(135deg, ${colorFor(featured.id)}, #0a0a0c)`;
  const coverInner = hasCover
    ? `<img src="${escapeAttr(featured.coverUrl)}" onerror="this.outerHTML=fallbackHtml('${escapeAttr(featured.title)}','${escapeAttr(featured.id)}')"/>`
    : fallbackHtml(featured.title, featured.id);

  let html = `
    <div id="hero">
      <div id="hero-bg" style="${bgStyle}"></div>
      <div class="scrim"></div>
      <div class="hero-content">
        <div class="hero-cover">${coverInner}</div>
        <div class="hero-body">
          <div class="eyebrow">Recently Added</div>
          <h1>${escapeHtml(featured.title)}</h1>
          <div class="genre-pills">${(featured.genres||[]).map(g=>`<span class="pill">${escapeHtml(g)}</span>`).join('')}</div>
          <p>${escapeHtml(featured.description||'')}</p>
          <div class="hero-actions">
            <button class="primary" onclick="openSeries('${featured.id}')">View Series</button>
            <button class="ghost" onclick="openAddSeries()">+ Add Series</button>
          </div>
        </div>
      </div>
    </div>
    <div class="wrap" id="rows-wrap"></div>
  `;
  body.innerHTML = html;
  const rowsWrap = document.getElementById('rows-wrap');

  // Community Activity row (recent reviews from everyone on this ComicBox)
  const activityRow = await buildActivityRow();
  if(activityRow) rowsWrap.appendChild(activityRow);

  // Continue Reading row (on list, not yet read)
  const continueItems = pd.toRead.filter(x=>!pd.read.some(r=>r.issueId===x.issueId));
  if(continueItems.length){
    rowsWrap.appendChild(await buildIssueRow('Continue Reading', continueItems, pd));
  }

  // Recently Added series row
  const recentSeries = state.seriesIndex.slice().sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));
  rowsWrap.appendChild(buildSeriesRow('Recently Added', recentSeries));

  // Genre rows
  const genreMap = {};
  state.seriesIndex.forEach(s=>{
    (s.genres && s.genres.length ? s.genres : ['Uncategorized']).forEach(g=>{
      genreMap[g] = genreMap[g] || [];
      genreMap[g].push(s);
    });
  });
  Object.keys(genreMap).sort().forEach(g=>{
    rowsWrap.appendChild(buildSeriesRow(g, genreMap[g]));
  });

  // Physical collection preview row
  if(pd.collection.length){
    rowsWrap.appendChild(await buildIssueRow('From Your Physical Collection', pd.collection, pd));
  }
}

/* Recent reviews across every member — a shared activity feed, like a group chat about comics. */
async function buildActivityRow(){
  const activity = [];
  for(const p of state.profiles){
    const d = await getProfileData(p.id);
    for(const [issueId, rev] of Object.entries(d.reviews||{})){
      activity.push({p, issueId, rev});
    }
  }
  if(!activity.length) return null;
  activity.sort((a,b)=>(b.rev.updatedAt||0)-(a.rev.updatedAt||0));
  const top = activity.slice(0,14);

  const row = document.createElement('div');
  row.className='row';
  const cardEls = [];
  for(const {p,issueId,rev} of top){
    const series = findSeries(rev.seriesId);
    if(!series) continue;
    const issues = await getIssues(rev.seriesId);
    const iss = issues.find(x=>x.id===issueId);
    if(!iss) continue;
    const card = document.createElement('div');
    card.className='poster-card';
    card.innerHTML = `
      <div class="art">
        ${coverOrFallback(iss.coverUrl || series.coverUrl, series.title+' #'+iss.number, iss.id)}
        <span class="badge" style="background:${p.color};">${initials(p.name)}</span>
      </div>
      <div class="t">${escapeHtml(series.title)} #${iss.number}</div>
      <div class="s">${escapeHtml(p.name)} · ${'★'.repeat(rev.rating)}${'☆'.repeat(5-rev.rating)}</div>
    `;
    card.onclick = ()=>jumpToIssue(series.id, iss.id);
    cardEls.push(card);
  }
  if(!cardEls.length) return null;
  row.innerHTML = `<div class="row-head"><h2>Community Activity</h2></div><div class="row-track" id="activity-track"></div>`;
  const track = row.querySelector('#activity-track');
  cardEls.forEach(c=>track.appendChild(c));
  return row;
}

function buildSeriesRow(title, seriesList){
  const row = document.createElement('div');
  row.className='row';
  const cards = seriesList.map(s=>`
    <div class="poster-card" onclick="openSeries('${s.id}')">
      <div class="art">${coverOrFallback(s.coverUrl, s.title, s.id)}</div>
      <div class="t">${escapeHtml(s.title)}</div>
      <div class="s">${escapeHtml(s.publisher||'')}</div>
    </div>
  `).join('');
  row.innerHTML = `<div class="row-head"><h2>${escapeHtml(title)}</h2></div><div class="row-track">${cards}</div>`;
  return row;
}

async function buildIssueRow(title, items, pd){
  const row = document.createElement('div');
  row.className='row';
  const cardsArr = [];
  for(const item of items.slice().sort((a,b)=>(b.addedAt||0)-(a.addedAt||0))){
    const series = findSeries(item.seriesId);
    if(!series) continue;
    const issues = await getIssues(item.seriesId);
    const iss = issues.find(x=>x.id===item.issueId);
    if(!iss) continue;
    const isRead = pd.read.some(x=>x.issueId===iss.id);
    const isOwned = pd.collection.some(x=>x.issueId===iss.id);
    cardsArr.push(`
      <div class="poster-card" onclick="jumpToIssue('${series.id}','${iss.id}')">
        <div class="art">
          ${coverOrFallback(iss.coverUrl || series.coverUrl, series.title+' #'+iss.number, iss.id)}
          ${isRead? '<span class="badge read">READ</span>' : (isOwned? '<span class="badge owned">OWNED</span>' : '')}
        </div>
        <div class="t">${escapeHtml(series.title)} #${iss.number}</div>
        <div class="s">${escapeHtml(iss.title||'')}</div>
      </div>
    `);
  }
  row.innerHTML = `<div class="row-head"><h2>${escapeHtml(title)}</h2></div><div class="row-track">${cardsArr.join('')}</div>`;
  return row;
}

/* ===================== HEROES: tab (grid + filter + search) ===================== */
async function renderHeroesTab(){
  const body = document.getElementById('home-body');
  const heroes = await getHeroes();

  body.innerHTML = `<div class="wrap" style="padding-top:34px;">
    <div class="section-title">Heroes <button class="small" onclick="openAddHero()">+ Add Hero</button></div>
    <div class="heroes-toolbar">
      <input id="heroes-search" placeholder="Search heroes…" value="${escapeAttr(state.heroesSearch)}" oninput="handleHeroesSearch(this.value)"/>
      <div class="aff-filter" id="aff-filter">
        <button data-aff="all" onclick="setHeroesFilter('all')">All</button>
        <button data-aff="hero" onclick="setHeroesFilter('hero')">Heroes</button>
        <button data-aff="villain" onclick="setHeroesFilter('villain')">Villains</button>
        <button data-aff="anti" onclick="setHeroesFilter('anti')">Anti-Heroes</button>
      </div>
    </div>
    <div id="heroes-grid" class="heroes-grid"></div>
  </div>`;
  [...document.querySelectorAll('#aff-filter button')].forEach(b=>b.classList.toggle('active', b.dataset.aff===state.heroesFilter));

  if(!heroes.length){
    document.getElementById('heroes-grid').innerHTML = '<div class="empty">No heroes yet. Add one, or tag a hero on any issue to create one on the fly.</div>';
    return;
  }

  const term = (state.heroesSearch||'').trim().toLowerCase();
  let list = heroes.filter(h=>{
    if(state.heroesFilter!=='all' && (h.affiliation||'hero')!==state.heroesFilter) return false;
    if(term && !(h.name.toLowerCase().includes(term) || (h.alias||'').toLowerCase().includes(term))) return false;
    return true;
  });

  // appearance counts, for the sort + "most featured" crown
  const counts = {};
  for(const h of list){ counts[h.id] = (await getHeroAppearances(h.id)).length; }
  list = list.slice().sort((a,b)=> counts[b.id]-counts[a.id] || a.name.localeCompare(b.name));
  const maxCount = list.length ? Math.max(...list.map(h=>counts[h.id])) : 0;

function renderHeroQuoteSwatches(h){
  const sw = document.getElementById('hf-quote-swatches');
  if(!sw) return;
  let chosen = (h && h.quoteColor) || QUOTE_PALETTE[0];
  sw.innerHTML = '';
  QUOTE_PALETTE.forEach(c=>{
    const d = document.createElement('div');
    d.className = 'swatch'+(c===chosen?' sel':'');
    d.style.background = c;
    d.onclick = ()=>{ chosen=c; [...sw.children].forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); };
    sw.appendChild(d);
  });
  window._chosenQuoteColor = ()=>chosen;

  const statKeys = ['strength','speed','intelligence','energy','fighting','durability'];

  statKeys.forEach(k=>{ stats[k] = parseInt(document.getElementById('hf-stat-'+k).value,10) || 1; });

    name: document.getElementById('hf-name').value.trim(),
    alias: document.getElementById('hf-alias').value.trim(),
    affiliation: document.getElementById('hf-affiliation').value,
    quoteStyle: document.getElementById('hf-quote-style').value,

async function deleteHero(){

  if(!confirm(`Delete ${h.name}? This removes them from every issue they're tagged in.`)) return;
  for(const series of state.seriesIndex){
    const issues = await getIssues(series.id);
    let changed = false;
    issues.forEach(iss=>{
      if((iss.heroIds||[]).includes(h.id)){ iss.heroIds = iss.heroIds.filter(id=>id!==h.id); changed = true; }

  }

  await saveHeroes(heroes);
  backToHeroes();
}

  const issues = await getIssues(s.id);
  if(!confirm(`Delete "${s.title}" and all ${issues.length} issue(s) in it? This can't be undone — it also removes it from everyone's lists and reviews.`)) return;
  const issueIds = new Set(issues.map(i=>i.id));
  const allUsers = await fetchAllUsers();
  for(const u of allUsers){
    const pd = await getProfileData(u.id);
    let changed = false;
    ['toRead','read','collection'].forEach(key=>{
      const before = pd[key].length;
      pd[key] = pd[key].filter(x=>!issueIds.has(x.issueId));
      if(pd[key].length!==before) changed = true;
    });
    Object.keys(pd.reviews||{}).forEach(iid=>{ if(issueIds.has(iid)){ delete pd.reviews[iid]; changed = true; } });
    if(changed) await saveProfileData(u.id);
  }
  state.seriesIndex = state.seriesIndex.filter(x=>x.id!==s.id);
  await sSet('series-index', state.seriesIndex);
  await sDel('issues:'+s.id);
  delete state.issuesCache[s.id];
  setTab('home');
}

function paintProgressRing(read, total){
  const wrapEl = document.getElementById('series-progress-wrap');
  const fill = document.getElementById('ring-fill-circle');
  if(!wrapEl || !fill) return;
  const circumference = 2*Math.PI*42;
  const pct = total ? read/total : 0;
  const prevOffset = fill.style.strokeDashoffset;
  fill.style.strokeDasharray = `${circumference}`;
  fill.style.strokeDashoffset = `${circumference*(1-pct)}`;
  const isComplete = total>0 && read===total;
  fill.classList.toggle('complete', isComplete);
  document.getElementById('ring-pct').textContent = Math.round(pct*100)+'%';
  document.getElementById('ring-sub').textContent = `${read}/${total}`;
  if(prevOffset && prevOffset !== fill.style.strokeDashoffset){
    wrapEl.classList.remove('pulse'); void wrapEl.offsetWidth; wrapEl.classList.add('pulse');
  }
}

async function deleteIssue(){
  const issues = await getIssues(state.currentSeriesId);
  const iss = issues.find(x=>x.id===state.currentIssueId);
  if(!iss) return;
  if(!confirm(`Delete issue #${iss.number}${iss.title? ' — '+iss.title:''}? This removes it from everyone's lists and reviews.`)) return;
  const allUsers = await fetchAllUsers();
  for(const u of allUsers){
    const pd = await getProfileData(u.id);
    let changed = false;
    ['toRead','read','collection'].forEach(key=>{
      const before = pd[key].length;
      pd[key] = pd[key].filter(x=>x.issueId!==iss.id);
      if(pd[key].length!==before) changed = true;
    });
    if(pd.reviews && pd.reviews[iss.id]){ delete pd.reviews[iss.id]; changed = true; }
    if(changed) await saveProfileData(u.id);
  }
  const remaining = issues.filter(x=>x.id!==iss.id);
  await saveIssues(state.currentSeriesId, remaining);
  backToSeries();
}

async function openIssue(id){
  state.currentIssueId = id;
  const issues = await getIssues(state.currentSeriesId);
  const iss = issues.find(x=>x.id===id);
  const series = findSeries(state.currentSeriesId);
  if(!iss || !series) return;

  document.getElementById('issue-title').textContent = `${series.title} #${iss.number}${iss.title? ' — '+iss.title:''}`;
  document.getElementById('issue-subtitle').textContent = series.publisher || '';
  document.getElementById('issue-desc').textContent = iss.description || 'No description on file yet.';

  const coverTitle = series.title+' #'+iss.number;
  state.issueMainCover = {url: iss.coverUrl||'', title: coverTitle, seed: iss.id};
  renderCoverFrame(state.issueMainCover, false);

  document.getElementById('issue-kv').innerHTML = `
    <div>Publish Date</div><div>${iss.publishDate? formatDate(iss.publishDate):'Unknown'}</div>
    <div>Writer</div><div>${escapeHtml(iss.writer)||'Unknown'}</div>
    <div>Penciller</div><div>${escapeHtml(iss.penciller)||'Unknown'}</div>
    <div>Cover Artist</div><div>${escapeHtml(iss.coverArtist)||'Unknown'}</div>
  `;

  const vwrap = document.getElementById('variant-strip');
  vwrap.innerHTML='';
  (iss.variants||[]).forEach((v,i)=>{
    const img = document.createElement('img');
    img.src = v.url; img.title = v.label||'Variant cover'; img.dataset.variantIndex = i;
    img.onerror=()=>img.remove();
    img.onclick=()=>focusVariant(v, img);
    vwrap.appendChild(img);
  });

  const heroWrap = document.getElementById('issue-heroes');
  const heroes = await getHeroes();
  const tagged = (iss.heroIds||[]).map(hid=>heroes.find(h=>h.id===hid)).filter(Boolean);
  heroWrap.innerHTML = tagged.map(h=>`
    <span class="hero-chip" onclick="jumpToHeroFromIssue('${h.id}')">
      <span class="hc-dot" style="background:${colorFor(h.id)}">${h.imageUrl? `<img src="${escapeAttr(h.imageUrl)}"/>` : initials(h.name)}</span>
      ${escapeHtml(h.name)}
    </span>
  `).join('');

  showView('issue');
  await refreshIssueActionsAndSocial();
}

    : '';
  frame.innerHTML = `<div class="issue-cover-frame" onclick="openCoverLightbox()">${flag}${coverOrFallback(coverData.url, coverData.title, coverData.seed)}</div>`;
}
function focusVariant(v, imgEl){
  renderCoverFrame({url:v.url, title:v.label||'Variant cover', seed:state.issueMainCover.seed, label:v.label}, true);
  document.querySelectorAll('.variant-strip img').forEach(el=>el.classList.remove('active'));
  imgEl.classList.add('active');

function resetToMainCover(){
  renderCoverFrame(state.issueMainCover, false);

async function refreshIssueActionsAndSocial(){
  const pd = await getProfileData(state.currentProfileId);
  const isRead = pd.read.some(x=>x.issueId===state.currentIssueId);
  const inList = pd.toRead.some(x=>x.issueId===state.currentIssueId);
  const owned = pd.collection.some(x=>x.issueId===state.currentIssueId);

  const bRead = document.getElementById('btn-read');
  bRead.textContent = isRead ? '✓ Read' : 'Mark as Read';
  bRead.classList.toggle('active', isRead);

  const bList = document.getElementById('btn-list');
  bList.textContent = inList ? '✓ On My List' : 'Add to My List';
  bList.classList.toggle('active', inList);

  const bColl = document.getElementById('btn-collection');
  bColl.textContent = owned ? '✓ In Physical Collection' : 'Add to Physical Collection';
  bColl.classList.toggle('active', owned);

  const whoWrap = document.getElementById('who-read');
  const revWrap = document.getElementById('reviews-list');
  whoWrap.innerHTML=''; revWrap.innerHTML='';
  let anyRead = false, anyReview = false;
  const allRatings = [];

  for(const p of state.profiles){
    const d = await getProfileData(p.id);
    if(d.read.some(x=>x.issueId===state.currentIssueId)){
      anyRead = true;
      const chip = document.createElement('div');
      chip.className='who-chip';
      chip.style.cursor='pointer';
      chip.innerHTML = `<span class="dot" style="background:${p.color}">${initials(p.name)}</span>${escapeHtml(p.name)}`;
      chip.onclick = ()=>openProfile(p.id);
      whoWrap.appendChild(chip);
    }
    const rev = d.reviews[state.currentIssueId];
    if(rev){
      anyReview = true;
      allRatings.push(rev.rating);
      const card = document.createElement('div');
      card.className='review-card';
      card.innerHTML = `
        <div class="rhead">
          <div class="who-chip" style="cursor:pointer;"><span class="dot" style="background:${p.color}">${initials(p.name)}</span>${escapeHtml(p.name)}</div>
          <div class="stars">${'★'.repeat(rev.rating)}${'☆'.repeat(5-rev.rating)}</div>
        </div>
        <div style="color:var(--dim);">${escapeHtml(rev.text)||'<span class="empty">No written review, just a rating.</span>'}</div>
      `;
      card.querySelector('.who-chip').onclick = (e)=>{ e.stopPropagation(); openProfile(p.id); };
      revWrap.appendChild(card);
    }
  }
  const avgEl = document.getElementById('issue-avg-rating');
  if(allRatings.length){
    const avg = allRatings.reduce((a,b)=>a+b,0) / allRatings.length;
    avgEl.innerHTML = `<span class="stars">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</span> <span class="mono" style="color:var(--dim2);font-size:11.5px;">${avg.toFixed(1)} · ${allRatings.length} rating${allRatings.length===1?'':'s'}</span>`;
  } else {
    avgEl.innerHTML = `<span class="mono" style="color:var(--dim2);font-size:11.5px;">No ratings yet</span>`;
  }
  if(!anyRead) whoWrap.innerHTML = '<div class="empty">Nobody\'s marked this one read yet.</div>';
  if(!anyReview) revWrap.innerHTML = '<div class="empty">No reviews yet. Be the first.</div>';
}

async function toggleRead(){
  const pd = await getProfileData(state.currentProfileId);
  const has = pd.read.some(x=>x.issueId===state.currentIssueId);
  const issues = await getIssues(state.currentSeriesId);
  const wasComplete = issues.length>0 && issues.every(i=>pd.read.some(x=>x.issueId===i.id));
  if(has){ pd.read = pd.read.filter(x=>x.issueId!==state.currentIssueId); }
  else{
    pd.read.push({issueId:state.currentIssueId, seriesId:state.currentSeriesId, addedAt:Date.now()});
    comicBurst(document.getElementById('btn-read'), pickBurstWord());
    const hr = new Date().getHours();
    if(hr>=0 && hr<4) pd.eggFlags.nightOwl = true;
  }
  await saveProfileData(state.currentProfileId);
  await refreshIssueActionsAndSocial();
  const nowComplete = issues.length>0 && issues.every(i=>pd.read.some(x=>x.issueId===i.id));
  if(!has && nowComplete && !wasComplete){
    const series = findSeries(state.currentSeriesId);
    celebrateSeriesComplete(series ? series.title : 'Series');
  }
  await checkAchievements(state.currentProfileId);
}
async function toggleReadList(){
  const pd = await getProfileData(state.currentProfileId);
  const has = pd.toRead.some(x=>x.issueId===state.currentIssueId);

  else{
    pd.toRead.push({issueId:state.currentIssueId, seriesId:state.currentSeriesId, addedAt:Date.now()});
    comicBurst(document.getElementById('btn-list'), 'NOTED!');

async function toggleCollection(){

  }
  await saveProfileData(state.currentProfileId);

}

/* ---------- fun feedback: comic bursts, confetti, completion banner ---------- */
const BURST_WORDS = ['POW!','ZAP!','BAM!','YEAH!','WHAM!','NICE!'];
function pickBurstWord(){ return BURST_WORDS[Math.floor(Math.random()*BURST_WORDS.length)]; }
const BURST_COLORS = ['#e0392c','#f2b705','#3c9169','#33a1c9'];
function comicBurst(anchorEl, text){
  if(!anchorEl) return;
  const r = anchorEl.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'comic-burst';
  el.textContent = text;
  el.style.left = (r.left + r.width/2) + 'px';
  el.style.top = r.top + 'px';
  el.style.color = BURST_COLORS[Math.floor(Math.random()*BURST_COLORS.length)];
  el.style.setProperty('--rot', (Math.random()*16-8)+'deg');
  document.body.appendChild(el);
  el.addEventListener('animationend', ()=>el.remove());
  setTimeout(()=>el.remove(), 1300);
}
function fireConfetti(count){
  count = count || 90;
  for(let i=0;i<count;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 6 + Math.random()*7;
    piece.style.width = size+'px';
    piece.style.height = (size*0.4)+'px';
    piece.style.left = (Math.random()*100)+'vw';
    piece.style.background = BURST_COLORS[Math.floor(Math.random()*BURST_COLORS.length)];
    piece.style.animationDuration = (1.6 + Math.random()*1.4)+'s';
    piece.style.animationDelay = (Math.random()*0.5)+'s';
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(), 3600);
  }
}
function celebrateSeriesComplete(seriesTitle){
  fireConfetti(110);
  const banner = document.createElement('div');
  banner.className = 'complete-banner';
  banner.innerHTML = `<div class="cb-title">SERIES COMPLETE! 🎉</div><div class="cb-sub">You've read every issue of ${escapeHtml(seriesTitle)}</div>`;
  document.body.appendChild(banner);
  setTimeout(()=>banner.remove(), 3200);
}
window.comicBurst=comicBurst; window.fireConfetti=fireConfetti; window.celebrateSeriesComplete=celebrateSeriesComplete;

function openReview(){
  const existing = state.profileData[state.currentProfileId] && state.profileData[state.currentProfileId].reviews[state.currentIssueId];
  showModal(`
    <h3>Write a review</h3>
    <div class="field">
      <label>Rating</label>
      <div class="star-picker" id="star-picker"></div>
      <div class="star-picker-label" id="star-picker-label">&nbsp;</div>
    </div>
    <div class="field"><label>Review</label><textarea id="rv-text" placeholder="What'd you think?">${existing? escapeHtml(existing.text):''}</textarea></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveReview()">Save review</button>
    </div>
  `);
  let rating = existing? existing.rating : 0;
  const picker = document.getElementById('star-picker');
  const labelEl = document.getElementById('star-picker-label');
  const labels = ['','Meh.','Okay!','Pretty good!','Great!','AMAZING!'];
  function draw(previewCount){
    const shown = previewCount!==undefined ? previewCount : rating;
    picker.innerHTML='';
    for(let i=1;i<=5;i++){
      const s = document.createElement('span');
      s.textContent='★';
      if(i<=shown) s.classList.add('on');
      s.onmouseenter=()=>draw(i);
      s.onclick=()=>{
        rating=i; draw(i);
        s.classList.add('pop');
        setTimeout(()=>s.classList.remove('pop'),350);
      };
      picker.appendChild(s);
    }
    labelEl.textContent = shown ? labels[shown] : '';
  }
  picker.onmouseleave=()=>draw();
  draw();
  window._getRating = ()=>rating;
}
async function saveReview(){
  const rating = window._getRating ? window._getRating() : 0;
  if(!rating){ alert('Pick a star rating.'); return; }
  const text = document.getElementById('rv-text').value.trim();
  const pd = await getProfileData(state.currentProfileId);
  const prev = pd.reviews[state.currentIssueId];
  if(prev && ((prev.rating===1 && rating===5) || (prev.rating===5 && rating===1))) pd.eggFlags.indecisive = true;
  pd.reviews[state.currentIssueId] = {seriesId: state.currentSeriesId, rating, text, updatedAt: Date.now()};
  if(rating===3){
    const threeStarCount = Object.values(pd.reviews).filter(r=>r.rating===3).length;
    if(threeStarCount>=5) pd.eggFlags.perfectlyFine = true;
  }
  await saveProfileData(state.currentProfileId);
  closeModal();
  await refreshIssueActionsAndSocial();
  await checkAchievements(state.currentProfileId);
}

function showModal(innerHtml){

  root.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${innerHtml}</div></div>`;
}

/* ===================== utils ===================== */
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }
function formatDate(d){
  try{
    const dt = new Date(d+'T00:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
  }catch(e){ return d; }
}
