<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LONGBOX — Track every issue</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Permanent+Marker&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c;
  --bg2:#161513;
  --bg3:#211f1c;
  --card:#1b1a17;
  --text:#f3f1e9;
  --dim:#a9a49a;
  --dim2:#716c62;
  --red:#e0392c;
  --yellow:#f2b705;
  --green:#3c9169;
  --cyan:#33a1c9;
  --line:1px solid #34322d;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
.hidden{display:none !important;}
h1,h2,h3,.display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.8px;font-weight:400;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:#3a382f;border-radius:4px;}
button{
  font-family:'Inter',sans-serif;
  font-weight:700;
  cursor:pointer;
  border:none;
  background:#2c2a26;
  color:var(--text);
  padding:10px 18px;
  border-radius:4px;
  font-size:13px;
  transition:background .12s ease, transform .08s ease;
}
button:hover{background:#3a372f;}
button:active{transform:scale(.97);}
button.primary{background:var(--red);color:#fff;}
button.primary:hover{background:#f04a3b;}
button.ghost{background:transparent;border:1.5px solid #4a4740;}
button.ghost:hover{background:#211f1c;}
button.small{padding:6px 12px;font-size:11.5px;}
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:2.5px solid var(--cyan); outline-offset:2px;
}
input,textarea,select{
  font-family:'Inter',sans-serif;
  border:1.5px solid #45423a;
  border-radius:4px;
  padding:9px 11px;
  background:#0f0e0c;
  color:var(--text);
  font-size:14px;
  width:100%;
}
input::placeholder,textarea::placeholder{color:#5f5b52;}
textarea{resize:vertical;min-height:70px;}
label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--dim);display:block;margin-bottom:5px;}
.field{margin-bottom:14px;}

/* ---------- shell ---------- */
#topbar{
  background:linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,0));
  padding:16px 32px 30px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
#topbar.solid{background:var(--bg2);border-bottom:var(--line);padding-bottom:16px;}
#topbar .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--red);letter-spacing:2px;}
#topbar .who{display:flex;align-items:center;gap:12px;}
.avatar{
  width:32px;height:32px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;
}
#tabs{display:flex;gap:22px;padding:0 32px;margin-top:-10px;position:relative;z-index:40;}
#tabs button{background:none;color:var(--dim);padding:8px 2px;border-radius:0;font-size:13.5px;border-bottom:2px solid transparent;}
#tabs button:hover{color:var(--text);background:none;}
#tabs button.active{color:var(--text);border-bottom-color:var(--red);}
main{padding:0 0 60px;}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px;}

/* ---------- hero ---------- */
#hero{
  position:relative;min-height:52vh;display:flex;align-items:flex-end;
  background-size:cover;background-position:center 20%;margin-bottom:18px;
}
#hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(10,10,12,.15) 0%, rgba(10,10,12,.55) 55%, var(--bg) 100%), linear-gradient(90deg, rgba(10,10,12,.85) 0%, rgba(10,10,12,.15) 60%);}
#hero .hero-body{position:relative;padding:0 32px 40px;max-width:620px;}
#hero .eyebrow{font-family:'JetBrains Mono',monospace;color:var(--yellow);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
#hero h1{font-size:52px;line-height:1;margin:0 0 10px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5);}
#hero p{color:#ddd8cc;font-size:15px;line-height:1.5;margin-bottom:18px;}
.genre-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.pill{font-size:11px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;border:1px solid #555145;color:var(--dim);padding:3px 10px;border-radius:20px;}
.hero-actions{display:flex;gap:10px;}

/* ---------- rows ---------- */
.row{margin-bottom:34px;}
.row-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 32px;margin-bottom:10px;}
.row-head h2{font-size:19px;margin:0;color:var(--text);font-family:'Inter',sans-serif;font-weight:800;}
.row-track{display:flex;gap:14px;overflow-x:auto;padding:6px 32px 14px;scroll-behavior:smooth;}
.poster-card{
  flex:0 0 auto;width:160px;cursor:pointer;
}
.poster-card .art{
  width:160px;height:224px;border-radius:6px;overflow:hidden;background:var(--card);
  border:1px solid #2c2a26;position:relative;transition:transform .15s ease, box-shadow .15s ease;
}
.poster-card:hover .art{transform:scale(1.045) translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.55);}
.poster-card img{width:100%;height:100%;object-fit:cover;display:block;}
.poster-card .cover-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.5px;text-align:center;padding:10px;color:#fff;}
.poster-card .badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);color:#fff;font-size:10.5px;
  font-family:'JetBrains Mono',monospace;padding:2px 6px;border-radius:3px;}
.poster-card .badge.read{background:var(--green);}
.poster-card .badge.owned{background:var(--cyan);}
.poster-card .t{font-size:12.5px;font-weight:700;margin-top:7px;line-height:1.3;}
.poster-card .s{font-size:11px;color:var(--dim2);margin-top:1px;}
.add-tile{
  flex:0 0 auto;width:160px;height:224px;border:1.5px dashed #4a4740;border-radius:6px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--dim);cursor:pointer;
}
.add-tile:hover{color:var(--text);border-color:#6a655a;}

/* ---------- profile select ---------- */
#view-profiles{max-width:820px;margin:70px auto;text-align:center;}
#view-profiles h1{font-size:56px;color:var(--red);margin-bottom:4px;}
#view-profiles p{color:var(--dim);margin-top:0;margin-bottom:34px;}
.profile-grid{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;}
.profile-card{width:140px;cursor:pointer;position:relative;text-align:center;}
.profile-card .big-avatar{
  width:100px;height:100px;border-radius:10px;margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:800;
  border:2px solid transparent;transition:border-color .12s ease, transform .12s ease;
}
.profile-card:hover .big-avatar{border-color:#fff;transform:scale(1.04);}
.profile-card .pname{font-weight:600;color:var(--dim);}
.profile-card:hover .pname{color:var(--text);}
.profile-card .del{
  position:absolute;top:-6px;right:14px;background:none;border:none;color:#c05a4d;font-size:18px;padding:2px 6px;
}
.new-profile-card{width:140px;display:flex;flex-direction:column;align-items:center;color:var(--dim);cursor:pointer;}
.new-profile-card .big-avatar{width:100px;height:100px;border-radius:10px;border:2px dashed #4a4740;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:10px;}
.new-profile-card:hover{color:var(--text);}
.new-profile-card:hover .big-avatar{border-color:#8a8578;}

/* ---------- panel / detail pages ---------- */
.panel{background:var(--card);border:var(--line);border-radius:8px;padding:24px;margin:0 0 22px;}
.backbtn{margin:18px 0 14px;}
.cover-tall{width:180px;border-radius:6px;display:block;}
.cover-fallback-tall{width:180px;aspect-ratio:2/3;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;text-align:center;padding:10px;color:#fff;}

.issue-row{
  display:flex;align-items:center;gap:14px;border:var(--line);border-radius:6px;
  padding:12px 16px;margin-bottom:10px;background:var(--card);cursor:pointer;
}
.issue-row:hover{background:var(--bg3);}
.issue-row .it{flex:1;}
.issue-row .it .tt{font-weight:700;}
.issue-row .it .dd{font-size:11.5px;color:var(--dim2);}
.burst{
  width:44px;height:44px;background:var(--yellow);color:#181614;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:'Permanent Marker',cursive;
  font-size:14px;flex-shrink:0;transform:rotate(-4deg);
}
.tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 8px;border-radius:10px;}
.tag.read{background:var(--green);color:#fff;}
.tag.owned{background:var(--cyan);color:#fff;}

.issue-hero{display:flex;gap:26px;flex-wrap:wrap;}
.issue-hero .cover-col{width:220px;flex-shrink:0;}
.variant-strip{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.variant-strip img{width:56px;height:84px;object-fit:cover;border-radius:4px;cursor:pointer;border:1px solid #3a372f;}
.info-col{flex:1;min-width:260px;}
.info-col h2{font-size:30px;margin:0 0 2px;color:#fff;}
.info-col .subtitle{color:var(--dim2);margin-bottom:14px;}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 10px;font-size:13.5px;margin-bottom:14px;}
.kv div:nth-child(odd){font-weight:700;color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;align-self:center;}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px;}
.actions-row button.active{background:var(--green);color:#fff;}
.actions-row button.active.owned-btn{background:var(--cyan);}

.section-title{font-size:19px;font-weight:800;border-bottom:var(--line);padding-bottom:8px;margin:26px 0 14px;display:flex;justify-content:space-between;align-items:center;}
.review-card{border:var(--line);border-radius:6px;padding:14px 16px;margin-bottom:10px;background:var(--card);}
.review-card .rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.stars{color:var(--yellow);letter-spacing:2px;font-size:14px;}
.who-list{display:flex;flex-wrap:wrap;gap:8px;}
.who-chip{display:flex;align-items:center;gap:6px;border:var(--line);border-radius:20px;padding:4px 12px 4px 4px;font-size:12.5px;font-weight:600;}
.who-chip .dot{width:20px;height:20px;border-radius:5px;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800;}

.empty{color:var(--dim2);font-style:italic;padding:16px 0;}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding:50px 16px;z-index:100;overflow:auto;}
.modal{background:var(--bg2);border:var(--line);border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.6);padding:24px;max-width:460px;width:100%;}
.modal h3{margin-top:0;color:#fff;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
.star-picker{display:flex;gap:4px;font-size:26px;cursor:pointer;}
.star-picker span{color:#3a372f;}
.star-picker span.on{color:var(--yellow);}
.import-note{font-size:11.5px;color:var(--dim2);border-left:2px solid #4a4740;padding-left:10px;margin-top:10px;}
.color-swatches{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid transparent;}
.swatch.sel{border-color:#fff;}
footer.indicia{max-width:1280px;margin:0 auto;padding:10px 32px 40px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim2);text-align:center;}
@media (max-width:640px){
  #topbar{padding:14px 16px 22px;}
  #tabs{padding:0 16px;gap:14px;}
  .wrap{padding:0 16px;}
  #hero .hero-body{padding:0 16px 30px;}
  .row-head{padding:0 16px;}
  .row-track{padding:6px 16px 14px;}
  #hero h1{font-size:36px;}
  .kv{grid-template-columns:100px 1fr;}
}
</style>
</head>
<body>

<div id="topbar" class="hidden">
  <div class="logo">LONGBOX</div>
  <input id="search-input" class="mono" placeholder="Search series…" oninput="handleSearchInput(this.value)"
    style="max-width:220px;background:rgba(255,255,255,.08);border-color:#4a4740;" />
  <div class="who">
    <span id="who-name" class="mono" style="font-size:12px;color:var(--dim);"></span>
    <div id="who-avatar" class="avatar"></div>
    <button class="small ghost" onclick="goProfiles()">Switch profile</button>
  </div>
</div>

<div id="tabs" class="hidden">
  <button data-tab="home" onclick="setTab('home')">Home</button>
  <button data-tab="mylist" onclick="setTab('mylist')">My List</button>
  <button data-tab="collection" onclick="setTab('collection')">Physical Collection</button>
  <button data-tab="reviews" onclick="setTab('reviews')">My Reviews</button>
</div>

<main>

<!-- PROFILE SELECT -->
<div id="view-profiles">
  <h1>LONGBOX</h1>
  <p>Pick a reader, or start a new one.</p>
  <div class="profile-grid" id="profile-grid"></div>
</div>

<!-- HOME (netflix-style rows / my list / collection / reviews all render into home-body) -->
<div id="view-home" class="hidden">
  <div id="home-body"></div>
</div>

<!-- SERIES PAGE -->
<div id="view-series" class="hidden">
  <div class="wrap">
    <button class="backbtn ghost small" onclick="setTab('home')">&larr; Back</button>
    <div class="panel">
      <div style="display:flex;gap:22px;flex-wrap:wrap;">
        <div id="series-cover-wrap"></div>
        <div style="flex:1;min-width:220px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
            <h2 id="series-title" style="font-size:32px;color:#fff;margin:0;"></h2>
            <button class="small ghost" onclick="openEditSeries()">Edit series</button>
          </div>
          <div id="series-publisher" class="mono" style="color:var(--dim2);margin-bottom:8px;font-size:12px;"></div>
          <div class="genre-pills" id="series-genres"></div>
          <p id="series-desc" style="color:var(--dim);"></p>
        </div>
      </div>
    </div>
    <div class="section-title">Issues <button class="small" onclick="openAddIssue()">+ Add Issue</button></div>
    <div id="issue-list"></div>
  </div>
</div>

<!-- ISSUE PAGE -->
<div id="view-issue" class="hidden">
  <div class="wrap">
    <button class="backbtn ghost small" onclick="backToSeries()">&larr; Back to series</button>
    <div class="panel">
      <div class="issue-hero">
        <div class="cover-col">
          <div id="issue-cover-wrap"></div>
          <div class="variant-strip" id="variant-strip"></div>
          <button class="small ghost" style="margin-top:8px;width:100%;" onclick="openAddVariant()">+ Add variant cover</button>
        </div>
        <div class="info-col">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
            <h2 id="issue-title"></h2>
            <button class="small ghost" onclick="openEditIssue()">Edit issue</button>
          </div>
          <div class="subtitle mono" id="issue-subtitle"></div>
          <div id="issue-avg-rating" style="margin-bottom:10px;"></div>
          <div class="kv" id="issue-kv"></div>
          <p id="issue-desc" style="color:var(--dim);"></p>
          <div class="actions-row">
            <button id="btn-read" onclick="toggleRead()">Mark as Read</button>
            <button id="btn-list" onclick="toggleReadList()">Add to My List</button>
            <button id="btn-collection" class="owned-btn" onclick="toggleCollection()">Add to Physical Collection</button>
            <button class="primary" onclick="openReview()">Write a Review</button>
          </div>
        </div>
      </div>
    </div>
    <div class="section-title">Who's read this</div>
    <div class="panel"><div class="who-list" id="who-read"></div></div>
    <div class="section-title">Reviews</div>
    <div class="panel" id="reviews-list"></div>
  </div>
</div>

</main>

<footer class="indicia" id="footer"></footer>
<div id="modal-root"></div>

<script>
/* ===================== storage helpers (with in-memory fallback) ===================== */
const memStore = {};
const hasRealStorage = () => (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function sGet(key){
  if(!hasRealStorage()){ return memStore.hasOwnProperty(key) ? JSON.parse(JSON.stringify(memStore[key])) : null; }
  try{
    const r = await window.storage.get(key, false);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function sSet(key, val){
  if(!hasRealStorage()){ memStore[key] = val; return; }
  try{ await window.storage.set(key, JSON.stringify(val), false); }
  catch(e){ console.warn('storage set failed, falling back to memory for this session', key, e); memStore[key]=val; }
}
async function sDel(key){
  if(!hasRealStorage()){ delete memStore[key]; return; }
  try{ await window.storage.delete(key, false); }catch(e){}
}

/* ===================== state ===================== */
const state = {
  profiles: [],
  currentProfileId: null,
  seriesIndex: [],
  issuesCache: {},
  profileData: {},
  currentSeriesId: null,
  currentIssueId: null,
  tab: 'home',
  searchTerm: ''
};

const PALETTE = ['#e0392c','#33a1c9','#f2b705','#3c9169','#9463d9','#d97a2e'];
function colorFor(seed){
  let h=0; for(const c of String(seed)) h = (h*31 + c.charCodeAt(0))>>>0;
  return PALETTE[h % PALETTE.length];
}
function initials(name){
  return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function emptyProfileData(){ return {toRead:[], read:[], collection:[], reviews:{}}; }

/* ===================== seed data ===================== */
async function seedIfEmpty(){
  const idx = await sGet('series-index');
  if(idx){ state.seriesIndex = idx; return; }
  const now = Date.now();
  const s1 = { id:'s-nightshade', title:'Nightshade Ink', publisher:'Halftone Comics', genres:['Mystery','Crime'],
    description:'A disgraced forensic illustrator starts seeing the crimes before they happen, sketched in ink that only she can see.', coverUrl:'', addedAt: now-1000*60*60*24*30 };
  const s2 = { id:'s-ironfeather', title:'Ironfeather', publisher:'Gutter & Gantry', genres:['Adventure','Fantasy'],
    description:'A retired sky-pirate is dragged back into the clouds when her old crew\'s ship is found flying itself.', coverUrl:'', addedAt: now-1000*60*60*24*5 };
  state.seriesIndex = [s1,s2];
  await sSet('series-index', state.seriesIndex);

  const issues1 = [
    {id:'ni-1', number:1, title:'The First Sketch', publishDate:'2019-03-06', writer:'Delia Kova', penciller:'Ruth Ambroza', coverArtist:'Ruth Ambroza', description:'Mara Voss draws a murder three days before it happens, and can\'t explain why the ink won\'t wash off her hands.', coverUrl:'', variants:[]},
    {id:'ni-2', number:2, title:'Wet Paint', publishDate:'2019-04-03', writer:'Delia Kova', penciller:'Ruth Ambroza', coverArtist:'Jun Okafor', description:'The detective who doesn\'t believe her starts believing the sketches more than the evidence.', coverUrl:'', variants:[]},
    {id:'ni-3', number:3, title:'Negative Space', publishDate:'2019-05-01', writer:'Delia Kova', penciller:'Ruth Ambroza', coverArtist:'Ruth Ambroza', description:'A sketch of Mara\'s own apartment turns up in the evidence locker.', coverUrl:'', variants:[]},
    {id:'ni-4', number:4, title:'The Unfinished Face', publishDate:'2019-06-05', writer:'Delia Kova', penciller:'Sam Iyer', coverArtist:'Jun Okafor', description:'Mara races to finish a drawing before the person in it stops breathing.', coverUrl:'', variants:[]}
  ];
  const issues2 = [
    {id:'if-1', number:1, title:'Grounded', publishDate:'2021-09-14', writer:'Otis Marchetti', penciller:'Priya Nandakumar', coverArtist:'Priya Nandakumar', description:'Cove Ashworth swore off the sky. The sky didn\'t swear off her.', coverUrl:'', variants:[]},
    {id:'if-2', number:2, title:'The Ship That Waited', publishDate:'2021-10-12', writer:'Otis Marchetti', penciller:'Priya Nandakumar', coverArtist:'Priya Nandakumar', description:'The Ironfeather has been flying a search pattern for six years with no one aboard.', coverUrl:'', variants:[]},
    {id:'if-3', number:3, title:'Old Crew', publishDate:'2021-11-09', writer:'Otis Marchetti', penciller:'Bea Solheim', coverArtist:'Priya Nandakumar', description:'Cove finds out exactly who\'s been feeding the ship coordinates.', coverUrl:'', variants:[]}
  ];
  state.issuesCache['s-nightshade'] = issues1;
  state.issuesCache['s-ironfeather'] = issues2;
  await sSet('issues:s-nightshade', issues1);
  await sSet('issues:s-ironfeather', issues2);
}

/* ===================== issues cache ===================== */
async function getIssues(seriesId){
  if(state.issuesCache[seriesId]) return state.issuesCache[seriesId];
  const data = await sGet('issues:'+seriesId) || [];
  state.issuesCache[seriesId] = data;
  return data;
}
async function saveIssues(seriesId, issues){
  state.issuesCache[seriesId] = issues;
  await sSet('issues:'+seriesId, issues);
}
function findSeries(id){ return state.seriesIndex.find(s=>s.id===id); }

/* ===================== profile data ===================== */
async function getProfileData(pid){
  if(state.profileData[pid]) return state.profileData[pid];
  const d = await sGet('profile-data:'+pid) || emptyProfileData();
  d.toRead = d.toRead||[]; d.read = d.read||[]; d.collection = d.collection||[]; d.reviews = d.reviews||{};
  state.profileData[pid] = d;
  return d;
}
async function saveProfileData(pid){

/* ===================== init ===================== */
async function init(){
  state.profiles = await sGet('profiles') || [];
  await seedIfEmpty();
  renderProfileGrid();
}

function renderProfileGrid(){
  const grid = document.getElementById('profile-grid');
  grid.innerHTML = '';
  state.profiles.forEach(p=>{
    const card = document.createElement('div');
    card.className='profile-card';
    card.innerHTML = `
      <button class="del" title="Delete profile" onclick="event.stopPropagation();deleteProfile('${p.id}')">&times;</button>
      <div class="big-avatar" style="background:${p.color}">${initials(p.name)}</div>
      <div class="pname">${escapeHtml(p.name)}</div>`;
    card.onclick = ()=>selectProfile(p.id);
    grid.appendChild(card);
  });
  const addCard = document.createElement('div');
  addCard.className='new-profile-card';
  addCard.innerHTML = `<div class="big-avatar">+</div><div>New profile</div>`;

function openAddProfile(){
  showModal(`
    <h3>New profile</h3>
    <div class="field"><label>Name</label><input id="np-name" maxlength="24" placeholder="e.g. Jordan" /></div>
    <div class="field"><label>Color</label><div class="color-swatches" id="np-swatches"></div></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="createProfile()">Create</button>
    </div>
  `);
  let chosen = PALETTE[0];
  const sw = document.getElementById('np-swatches');
  PALETTE.forEach((c,i)=>{
    const d = document.createElement('div');
    d.className='swatch'+(i===0?' sel':'');
    d.style.background=c;
    d.onclick=()=>{ chosen=c; [...sw.children].forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); };
    sw.appendChild(d);
  });
  window._chosenColor = ()=>chosen;
  document.getElementById('np-name').focus();
}
async function createProfile(){
  const name = document.getElementById('np-name').value.trim();
  if(!name){ alert('Give this profile a name.'); return; }
  const id = 'p-'+Math.random().toString(36).slice(2,10);
  const color = window._chosenColor ? window._chosenColor() : colorFor(name);
  state.profiles.push({id,name,color});
  await sSet('profiles', state.profiles);
  state.profileData[id] = emptyProfileData();
  await saveProfileData(id);
  closeModal();
  renderProfileGrid();
}
async function deleteProfile(id){
  if(!confirm('Delete this profile and all of its lists and reviews? This can\'t be undone.')) return;
  state.profiles = state.profiles.filter(p=>p.id!==id);
  await sSet('profiles', state.profiles);
  await sDel('profile-data:'+id);
  delete state.profileData[id];
  renderProfileGrid();
}

function goProfiles(){
  state.currentProfileId = null;
  state.searchTerm = '';
  const si = document.getElementById('search-input'); if(si) si.value='';
  document.getElementById('topbar').classList.add('hidden');
  document.getElementById('tabs').classList.add('hidden');
  showView('profiles');
  document.getElementById('footer').textContent='';
}

async function selectProfile(id){
  state.currentProfileId = id;
  await getProfileData(id);
  const p = state.profiles.find(x=>x.id===id);
  document.getElementById('who-name').textContent = p.name;
  const av = document.getElementById('who-avatar');
  av.style.background = p.color; av.textContent = initials(p.name);
  document.getElementById('topbar').classList.remove('hidden');
  document.getElementById('tabs').classList.remove('hidden');
  document.getElementById('footer').textContent = 'LONGBOX — READ. COLLECT. REVIEW.';

/* ===================== view switching ===================== */
function showView(name){
  ['profiles','home','series','issue'].forEach(v=>{
    document.getElementById('view-'+v).classList.toggle('hidden', v!==name);
  });
  document.getElementById('topbar').classList.toggle('solid', name!=='home');
}
function setTab(tab){
  state.tab = tab;
  [...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  showView('home');
  if(tab==='home') renderHomeTab();
  else if(tab==='mylist') renderSimpleList('toRead','My List','Nothing on your list yet. Open any issue and hit "Add to My List."');
  else if(tab==='collection') renderSimpleList('collection','Physical Collection','No issues marked as owned yet. Open an issue and hit "Add to Physical Collection."');
  else if(tab==='reviews') renderMyReviews();
}

/* ===================== cover helpers ===================== */
function coverOrFallback(url, title, seed){
  if(url){ return `<img src="${escapeAttr(url)}" onerror="this.outerHTML=fallbackHtml('${escapeAttr(title)}','${escapeAttr(seed)}')"/>`; }
  return fallbackHtml(title, seed);
}
function fallbackHtml(title, seed){
  return `<div class="cover-fallback" style="background:${colorFor(seed)}">${escapeHtml(title)}</div>`;
}
window.fallbackHtml = fallbackHtml;

/* ===================== HOME: hero + netflix rows ===================== */
function handleSearchInput(val){
  state.searchTerm = val;
  if(state.tab !== 'home') setTab('home');
  else renderHomeTab();
}

async function renderHomeTab(){
  const body = document.getElementById('home-body');
  if(!state.seriesIndex.length){
    body.innerHTML = `<div class="wrap" style="padding-top:60px;">
      <div class="section-title">Nothing here yet</div>
      <div class="empty">Add your first series to start building your library.</div>
      <button class="primary" onclick="openAddSeries()">+ Add series</button>
    </div>`;
    return;
  }

  const term = (state.searchTerm||'').trim().toLowerCase();
  if(term){
    const matches = state.seriesIndex.filter(s=>s.title.toLowerCase().includes(term) || (s.publisher||'').toLowerCase().includes(term) || (s.genres||[]).some(g=>g.toLowerCase().includes(term)));
    body.innerHTML = `<div class="wrap" style="padding-top:34px;">
      <div class="section-title">Results for "${escapeHtml(state.searchTerm)}"</div>
      ${matches.length ? '' : '<div class="empty">No series match that search.</div>'}
      <div class="grid-results" style="display:flex;flex-wrap:wrap;gap:16px;"></div>
    </div>`;
    const resWrap = body.querySelector('.grid-results');
    matches.forEach(s=>{
      const card = document.createElement('div');
      card.className='poster-card';
      card.innerHTML = `<div class="art">${coverOrFallback(s.coverUrl, s.title, s.id)}</div>
        <div class="t">${escapeHtml(s.title)}</div><div class="s">${escapeHtml(s.publisher||'')}</div>`;
      card.onclick = ()=>openSeries(s.id);
      resWrap.appendChild(card);
    });
    return;
  }

  const pd = await getProfileData(state.currentProfileId);

  // hero: most recently added series
  const featured = state.seriesIndex.slice().sort((a,b)=>(b.addedAt||0)-(a.addedAt||0))[0];
  const heroBg = featured.coverUrl ? `url('${featured.coverUrl}')` : `linear-gradient(135deg, ${colorFor(featured.id)}, #0a0a0c)`;

  let html = `
    <div id="hero" style="background-image:${heroBg}">
      <div class="scrim"></div>
      <div class="hero-body">
        <div class="eyebrow">Recently Added</div>
        <h1>${escapeHtml(featured.title)}</h1>
        <div class="genre-pills">${(featured.genres||[]).map(g=>`<span class="pill">${escapeHtml(g)}</span>`).join('')}</div>
        <p>${escapeHtml(featured.description||'')}</p>
        <div class="hero-actions">
          <button class="primary" onclick="openSeries('${featured.id}')">View Series</button>
          <button class="ghost" onclick="openAddSeries()">+ Add Series</button>
        </div>
      </div>
    </div>
    <div class="wrap" id="rows-wrap"></div>
  `;
  body.innerHTML = html;
  const rowsWrap = document.getElementById('rows-wrap');

  // Continue Reading row (on list, not yet read)
  const continueItems = pd.toRead.filter(x=>!pd.read.some(r=>r.issueId===x.issueId));
  if(continueItems.length){
    rowsWrap.appendChild(await buildIssueRow('Continue Reading', continueItems, pd));
  }

  // Recently Added series row
  const recentSeries = state.seriesIndex.slice().sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));
  rowsWrap.appendChild(buildSeriesRow('Recently Added', recentSeries));

  // Genre rows
  const genreMap = {};
  state.seriesIndex.forEach(s=>{
    (s.genres && s.genres.length ? s.genres : ['Uncategorized']).forEach(g=>{
      genreMap[g] = genreMap[g] || [];
      genreMap[g].push(s);
    });
  });
  Object.keys(genreMap).sort().forEach(g=>{
    rowsWrap.appendChild(buildSeriesRow(g, genreMap[g]));
  });

  // Physical collection preview row
  if(pd.collection.length){
    rowsWrap.appendChild(await buildIssueRow('From Your Physical Collection', pd.collection, pd));
  }
}

function buildSeriesRow(title, seriesList){
  const row = document.createElement('div');
  row.className='row';
  const cards = seriesList.map(s=>`
    <div class="poster-card" onclick="openSeries('${s.id}')">
      <div class="art">${coverOrFallback(s.coverUrl, s.title, s.id)}</div>
      <div class="t">${escapeHtml(s.title)}</div>
      <div class="s">${escapeHtml(s.publisher||'')}</div>
    </div>
  `).join('');
  row.innerHTML = `<div class="row-head"><h2>${escapeHtml(title)}</h2></div><div class="row-track">${cards}</div>`;
  return row;
}

async function buildIssueRow(title, items, pd){
  const row = document.createElement('div');
  row.className='row';
  const cardsArr = [];
  for(const item of items.slice().sort((a,b)=>(b.addedAt||0)-(a.addedAt||0))){
    const series = findSeries(item.seriesId);
    if(!series) continue;
    const issues = await getIssues(item.seriesId);
    const iss = issues.find(x=>x.id===item.issueId);
    if(!iss) continue;
    const isRead = pd.read.some(x=>x.issueId===iss.id);
    const isOwned = pd.collection.some(x=>x.issueId===iss.id);
    cardsArr.push(`
      <div class="poster-card" onclick="jumpToIssue('${series.id}','${iss.id}')">
        <div class="art">
          ${coverOrFallback(iss.coverUrl || series.coverUrl, series.title+' #'+iss.number, iss.id)}
          ${isRead? '<span class="badge read">READ</span>' : (isOwned? '<span class="badge owned">OWNED</span>' : '')}
        </div>
        <div class="t">${escapeHtml(series.title)} #${iss.number}</div>
        <div class="s">${escapeHtml(iss.title||'')}</div>
      </div>
    `);
  }
  row.innerHTML = `<div class="row-head"><h2>${escapeHtml(title)}</h2></div><div class="row-track">${cardsArr.join('')}</div>`;
  return row;
}

async function jumpToIssue(seriesId, issueId){
  state.currentSeriesId = seriesId;
  await openIssue(issueId);
}

  for(const item of items.slice().sort((a,b)=>(b.addedAt||0)-(a.addedAt||0))){
    const series = findSeries(item.seriesId);
    if(!series) continue;
    const issues = await getIssues(item.seriesId);
    const iss = issues.find(x=>x.id===item.issueId);
    if(!iss) continue;
    const row = document.createElement('div');
    row.className='issue-row';
    row.innerHTML = `
      <div class="burst">#${iss.number}</div>

async function renderMyReviews(){
  const body = document.getElementById('home-body');
  const pd = await getProfileData(state.currentProfileId);
  const entries = Object.entries(pd.reviews);
  body.innerHTML = `<div class="wrap" style="padding-top:30px;"><div class="section-title">My Reviews</div><div id="list-body"></div></div>`;
  const listBody = document.getElementById('list-body');
  if(!entries.length){ listBody.innerHTML = '<div class="empty">You haven\'t reviewed anything yet. Open an issue and hit "Write a Review."</div>'; return; }
  for(const [issueId, rev] of entries.sort((a,b)=>(b[1].updatedAt||0)-(a[1].updatedAt||0))){
    const series = findSeries(rev.seriesId);
    if(!series) continue;
    const issues = await getIssues(rev.seriesId);
    const iss = issues.find(x=>x.id===issueId);
    if(!iss) continue;
    const card = document.createElement('div');
    card.className='review-card';
    card.style.cursor='pointer';
    card.innerHTML = `
      <div class="rhead">
        <div class="tt" style="font-weight:700;">${escapeHtml(series.title)} #${iss.number}${iss.title? ' — '+escapeHtml(iss.title):''}</div>
        <div class="stars">${'★'.repeat(rev.rating)}${'☆'.repeat(5-rev.rating)}</div>
      </div>
      <div style="color:var(--dim);">${escapeHtml(rev.text)||'<span class="empty">No written review, just a rating.</span>'}</div>
    `;
    card.onclick = ()=>jumpToIssue(rev.seriesId, issueId);
    listBody.appendChild(card);
  }
}

  document.getElementById('issue-subtitle').textContent = series.publisher || '';
  document.getElementById('issue-desc').textContent = iss.description || 'No description on file yet.';
  document.getElementById('issue-cover-wrap').innerHTML = `<div style="width:220px;">${coverOrFallback(iss.coverUrl, series.title+' #'+iss.number, iss.id)}</div>`;

  document.getElementById('issue-kv').innerHTML = `
    <div>Publish Date</div><div>${iss.publishDate? formatDate(iss.publishDate):'Unknown'}</div>
    <div>Writer</div><div>${escapeHtml(iss.writer)||'Unknown'}</div>
    <div>Penciller</div><div>${escapeHtml(iss.penciller)||'Unknown'}</div>
    <div>Cover Artist</div><div>${escapeHtml(iss.coverArtist)||'Unknown'}</div>
  `;

  const vwrap = document.getElementById('variant-strip');
  vwrap.innerHTML='';
  (iss.variants||[]).forEach(v=>{
    const img = document.createElement('img');
    img.src = v.url; img.title = v.label||'Variant cover';
    img.onerror=()=>img.remove();
    vwrap.appendChild(img);
  });

  showView('issue');
  await refreshIssueActionsAndSocial();
}

async function refreshIssueActionsAndSocial(){
  const pd = await getProfileData(state.currentProfileId);
  const isRead = pd.read.some(x=>x.issueId===state.currentIssueId);
  const inList = pd.toRead.some(x=>x.issueId===state.currentIssueId);
  const owned = pd.collection.some(x=>x.issueId===state.currentIssueId);

  const bRead = document.getElementById('btn-read');
  bRead.textContent = isRead ? '✓ Read' : 'Mark as Read';
  bRead.classList.toggle('active', isRead);

  const bList = document.getElementById('btn-list');
  bList.textContent = inList ? '✓ On My List' : 'Add to My List';
  bList.classList.toggle('active', inList);

  const bColl = document.getElementById('btn-collection');
  bColl.textContent = owned ? '✓ In Physical Collection' : 'Add to Physical Collection';
  bColl.classList.toggle('active', owned);

  const whoWrap = document.getElementById('who-read');
  const revWrap = document.getElementById('reviews-list');
  whoWrap.innerHTML=''; revWrap.innerHTML='';
  let anyRead = false, anyReview = false;
  const allRatings = [];

  for(const p of state.profiles){
    const d = await getProfileData(p.id);
    if(d.read.some(x=>x.issueId===state.currentIssueId)){
      anyRead = true;
      const chip = document.createElement('div');
      chip.className='who-chip';
      chip.innerHTML = `<span class="dot" style="background:${p.color}">${initials(p.name)}</span>${escapeHtml(p.name)}`;
      whoWrap.appendChild(chip);
    }
    const rev = d.reviews[state.currentIssueId];
    if(rev){
      anyReview = true;
      allRatings.push(rev.rating);
      const card = document.createElement('div');
      card.className='review-card';
      card.innerHTML = `
        <div class="rhead">
          <div class="who-chip"><span class="dot" style="background:${p.color}">${initials(p.name)}</span>${escapeHtml(p.name)}</div>
          <div class="stars">${'★'.repeat(rev.rating)}${'☆'.repeat(5-rev.rating)}</div>
        </div>
        <div style="color:var(--dim);">${escapeHtml(rev.text)||'<span class="empty">No written review, just a rating.</span>'}</div>
      `;
      revWrap.appendChild(card);
    }
  }
  const avgEl = document.getElementById('issue-avg-rating');
  if(allRatings.length){
    const avg = allRatings.reduce((a,b)=>a+b,0) / allRatings.length;
    avgEl.innerHTML = `<span class="stars">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</span> <span class="mono" style="color:var(--dim2);font-size:11.5px;">${avg.toFixed(1)} · ${allRatings.length} rating${allRatings.length===1?'':'s'}</span>`;
  } else {
    avgEl.innerHTML = `<span class="mono" style="color:var(--dim2);font-size:11.5px;">No ratings yet</span>`;
  }
  if(!anyRead) whoWrap.innerHTML = '<div class="empty">Nobody\'s marked this one read yet.</div>';
  if(!anyReview) revWrap.innerHTML = '<div class="empty">No reviews yet. Be the first.</div>';
}

async function toggleRead(){
  const pd = await getProfileData(state.currentProfileId);
  const has = pd.read.some(x=>x.issueId===state.currentIssueId);
  if(has){ pd.read = pd.read.filter(x=>x.issueId!==state.currentIssueId); }
  else{ pd.read.push({issueId:state.currentIssueId, seriesId:state.currentSeriesId, addedAt:Date.now()}); }
  await saveProfileData(state.currentProfileId);
  await refreshIssueActionsAndSocial();
}

function openAddVariant(){
  showModal(`
    <h3>Add a variant cover</h3>
    <div class="field"><label>Label</label><input id="av-label" placeholder="e.g. 1:25 Retailer Incentive"/></div>
    <div class="field"><label>Image URL</label><input id="av-url" placeholder="https://..."/></div>
    <div class="import-note">Artifacts can't accept direct file uploads, host the image somewhere (e.g. Imgur) and paste the link here.</div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveVariant()">Add variant</button>
    </div>
  `);
}
async function saveVariant(){
  const url = document.getElementById('av-url').value.trim();
  if(!url){ alert('Paste an image URL.'); return; }
  const label = document.getElementById('av-label').value.trim();
  const issues = await getIssues(state.currentSeriesId);
  const iss = issues.find(x=>x.id===state.currentIssueId);
  iss.variants = iss.variants || [];
  iss.variants.push({url,label});
  await saveIssues(state.currentSeriesId, issues);
  closeModal();
  await openIssue(state.currentIssueId);
}

function openReview(){
  const existing = state.profileData[state.currentProfileId] && state.profileData[state.currentProfileId].reviews[state.currentIssueId];
  showModal(`
    <h3>Write a review</h3>
    <div class="field"><label>Rating</label><div class="star-picker" id="star-picker"></div></div>
    <div class="field"><label>Review</label><textarea id="rv-text" placeholder="What'd you think?">${existing? escapeHtml(existing.text):''}</textarea></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveReview()">Save review</button>
    </div>
  `);
  let rating = existing? existing.rating : 0;
  const picker = document.getElementById('star-picker');
  function draw(){
    picker.innerHTML='';
    for(let i=1;i<=5;i++){
      const s = document.createElement('span');
      s.textContent='★';
      if(i<=rating) s.classList.add('on');
      s.onclick=()=>{ rating=i; draw(); };
      picker.appendChild(s);
    }
  }
  draw();
  window._getRating = ()=>rating;
}
async function saveReview(){
  const rating = window._getRating ? window._getRating() : 0;
  if(!rating){ alert('Pick a star rating.'); return; }
  const text = document.getElementById('rv-text').value.trim();
  const pd = await getProfileData(state.currentProfileId);
  pd.reviews[state.currentIssueId] = {seriesId: state.currentSeriesId, rating, text, updatedAt: Date.now()};
  await saveProfileData(state.currentProfileId);
  closeModal();
  await refreshIssueActionsAndSocial();
}

function showModal(innerHtml){

  root.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${innerHtml}</div></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ===================== utils ===================== */
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }
function formatDate(d){
  try{
    const dt = new Date(d+'T00:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
  }catch(e){ return d; }
}
